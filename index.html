<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate & Pace Run</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column, bottom tab bar, full-screen run display built for glancing mid-stride. Red = running, pace band colours = feedback. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#121721; --muted:#5A6474; --line:#D5DBE3;
  --red:#CF372B; --red-soft:#FBE5E2; --on-red:#FFFFFF;
  --ok:#1B8350; --ok-soft:#DDF2E6; --slow:#A66B12; --slow-soft:#FBEFD9; --fast:#1D4ED6; --fast-soft:#E2E9FB;
  --blue:#1D4ED6; --blue-soft:#E2E9FB; --on-blue:#FFFFFF; --yellow:#E2AE00; --green:#1C9655; --pwhite:#F6F6F1; --pblack:#2B2F36; --psilver:#AEB4BD;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1116; --surface:#171B22; --sunk:#202633; --ink:#E8ECF2; --muted:#98A2B2; --line:#2B323E;
  --red:#F2685C; --red-soft:#3A1F1D; --on-red:#1A0806;
  --ok:#4CC284; --ok-soft:#173326; --slow:#E3A94C; --slow-soft:#3A2D16; --fast:#7194FF; --fast-soft:#1C2741;
  --blue:#7194FF; --blue-soft:#1C2741; --on-blue:#0A1020; --pwhite:#E9E9E3; --pblack:#4A505A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
img,svg{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.3rem;font-weight:700;line-height:1}
h2{font-size:1.4rem;font-weight:600;line-height:1.1}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{border-color:var(--red);border-width:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-family:var(--display);font-size:1.4rem;letter-spacing:.04em;text-transform:uppercase}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.875rem}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.slow{background:var(--slow-soft);color:var(--slow)} .chip.fast{background:var(--fast-soft);color:var(--fast)}
.chip.sel{background:var(--ink);color:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* Segments */
.segs{display:flex;flex-direction:column}
.seg{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.seg:first-child{border-top:0}
.seg i{width:10px;align-self:stretch;border-radius:3px;background:var(--sunk)}
.seg.work i{background:var(--red)} .seg.steady i{background:var(--muted)}
.seg .v{font-family:var(--display);font-weight:600;font-size:1.05rem;text-align:right;white-space:nowrap}

/* Week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk .d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:.75rem;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.wk .d b{font-family:var(--display);font-size:1.2rem;line-height:1}
.wk .d.today{border-color:var(--ink);border-width:2px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.plan{border-color:var(--red)} .dot.done{background:var(--red);border-color:var(--red)} .dot.skip{background:var(--line);border-color:var(--line)}

/* Plan list */
.week{display:flex;flex-direction:column;gap:6px}
.week h3 .muted{font-family:var(--body);font-size:.85rem;font-weight:400}
.sess{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%}
.sess .dd{font-family:var(--display);font-weight:600;line-height:1.05}
.sess .dd small{display:block;color:var(--muted);font-size:.8rem;font-family:var(--body);font-weight:600}
.sess.done{opacity:.7} .sess.skipped .tt{text-decoration:line-through;color:var(--muted)}
.sess.today{border-color:var(--red);border-width:2px}
.tt{font-weight:600;min-width:0}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{padding:12px 2px 13px;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;border-top:3px solid transparent}
.tabs a[data-v="gym"][aria-current="page"]{border-top-color:var(--blue)}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}

/* Sheet & modal */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.foot .in>.btn{flex:1}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}

/* Run screen */
.run{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;user-select:none;-webkit-user-select:none}
.run .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-weight:600}
.gps{display:inline-flex;gap:6px;align-items:center}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--slow)}
.gps.good i{background:var(--ok)} .gps.bad i{background:var(--red)}
.segnow{border-radius:var(--r);padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.segnow.work{background:var(--red);border-color:var(--red);color:var(--on-red)}
.segnow.work .muted,.segnow.work .next{color:inherit;opacity:.9}
.segnow .lab{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.05}
.segnow .rem{font-family:var(--display);font-size:3.6rem;font-weight:700;line-height:1}
.prog{height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.prog>b{display:block;height:100%;background:currentColor}
.pacebox{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.pacebox.ok{background:var(--ok-soft);color:var(--ok)} .pacebox.slow{background:var(--slow-soft);color:var(--slow)} .pacebox.fast{background:var(--fast-soft);color:var(--fast)}
.pacebox .big{font-family:var(--display);font-size:clamp(4rem,22vw,6.5rem);font-weight:700;line-height:.9}
.pacebox .hint{font-weight:700;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stats b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.05}
.stats span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.run .ctrl{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);opacity:.35}
.next{font-size:.95rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
.route{width:100%;height:auto;background:var(--sunk);border-radius:8px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}
.rpe button.on{background:var(--red);color:var(--on-red);border-color:var(--red)}
.note{border-left:3px solid var(--red);padding-left:10px}
/* Day strip, gym, player */
.wkbar{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;align-items:center}
.wkbar .nav{min-height:36px;padding:0;border-radius:8px}
.wk button.d{cursor:pointer;font:inherit;color:inherit}
.wk .d.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk .d.sel .muted{color:inherit;opacity:.8}
.dot.gym{border-color:var(--blue)} .dot.gym.done{background:var(--blue)}
.dot.rec{border-color:var(--muted)} .dot.rec.done{background:var(--muted)}
.wk .d.sel .dot.done{border-color:var(--bg)}
.hero.gymc{border-color:var(--blue)}
.btn.blue{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip.lift{background:var(--blue-soft);color:var(--blue)} .chip.up{background:var(--blue);color:var(--on-blue)}
.chip.warn{color:var(--slow)} .chip.bad{color:var(--red)} .chip.good{color:var(--ok)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.ex:first-child{border-top:0}
.ex .nm{font-weight:600;min-width:0}
.ex .tg{font-family:var(--display);font-size:1.1rem;font-weight:600;text-align:right;white-space:nowrap}
.ex .sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spark{width:90px;height:28px;flex:none}
.plates{display:flex;align-items:center;gap:2px;height:30px;flex-wrap:nowrap}
.plates .barend{width:16px;height:6px;background:var(--psilver);border-radius:1px}
.pl{width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.p25{background:#CF372B;height:30px}.p20{background:#1D4ED6;height:30px}.p15{background:var(--yellow);height:27px}
.p10{background:var(--green);height:24px}.p5{background:var(--pwhite);height:19px;border-color:var(--muted)}
.p2{background:var(--pblack);height:15px;width:7px}.p1{background:var(--psilver);height:12px;width:6px}
.platecap{font-size:.75rem;color:var(--muted);margin-left:8px}
.setrow{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.setrow .sn{font-family:var(--display);font-weight:600;color:var(--muted)}
.setbtn{width:48px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.setbtn.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.wt{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.wt input{text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:600}
.ramp{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 10px}
.resttimer{display:flex;align-items:center;gap:8px;flex:1;font-family:var(--display);font-size:1.25rem;font-weight:600;min-width:0}
.verdict{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.verdict:first-child{border-top:0}
.edrow{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.edrow:first-child{border-top:0;padding-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.player{position:fixed;inset:0;z-index:75;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ring{width:min(62vw,250px);aspect-ratio:1;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .cnt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:4.2rem;font-weight:700}
.player .pname{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.05;max-width:20ch}
.player .cue{max-width:34ch;color:var(--muted)}

/* v4: coach, overview lists, plan picker */
.olist{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;counter-reset:s}
.olist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);counter-increment:s}
.olist li:first-child{border-top:0}
.olist li::before{content:counter(s);font-family:var(--display);color:var(--muted);min-width:22px}
.olist li>span:first-of-type{flex:1;min-width:0}
.olist li.cur{font-weight:700;color:var(--ink)} .olist li.cur::before{color:var(--red)} .olist li.past{opacity:.5}
.equip{margin:0} .equip strong{font-weight:600}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.stepper .btn{min-height:56px;font-size:1.5rem}
.stepper .val{text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.coach h1{font-size:2.1rem}
.prog2{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog2>b{display:block;height:100%;background:var(--blue)}
.restbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:var(--r);background:var(--blue-soft);color:var(--blue)}
.restbox .big{font-family:var(--display);font-size:5rem;font-weight:700;line-height:1}
.ptop{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick .btn{padding:0;min-height:44px;font-size:.85rem}
.daypick .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progpick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;width:100%}
.progpick:disabled{opacity:.55;cursor:default}
.planrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0 8px 10px;border-top:1px solid var(--line)}
.itemc h2{font-size:1.5rem}


.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.card summary{cursor:pointer;list-style:revert}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.coachnote{border-color:var(--blue);background:var(--blue-soft)}

details.lib{border-top:1px solid var(--line);padding:8px 0}
details.lib summary{cursor:pointer;list-style:revert}
.btn.vmute{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.run .bar #rTitle{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.celebrate{text-align:center;padding:22px 16px;border-radius:20px;background:linear-gradient(135deg,#ffe3ee,#fff1d6);color:#3a1f2b;animation:cpop .5s ease-out}
.celebrate .cbig{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.celebrate p{margin:8px 0 0;color:#6b4a57}
.celebrate.small{padding:12px 14px;font-weight:700;font-size:1rem}
.card.affirm p{font-size:1.15rem;font-weight:600;line-height:1.35;margin:6px 0 0}
@keyframes cpop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cfall 2.6s ease-in forwards}
@keyframes cfall{to{top:105%;opacity:.2;transform:translateX(30px) rotate(540deg)}}
@media (prefers-color-scheme:dark){.celebrate{background:linear-gradient(135deg,#4a2034,#4a3a1c);color:#fff}.celebrate p{color:#f1d9e3}}
.seg2{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;color:var(--muted);min-height:34px;cursor:pointer}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.listrest{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--blue);color:#fff;border-radius:16px;padding:12px 14px}
.listrest b{font-size:1.6rem}
.listrest .btn{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
details.howbox{margin-top:8px;text-align:left}

"use strict";
/* ============================== clock (sim-aware) ============================== */
const QS = new URLSearchParams(location.search);
const SIM = Number(QS.get("sim")) || 0;          // ?sim=10 → simulated GPS at 10× speed
const T0 = Date.now();
const now = () => SIM ? T0 + (Date.now()-T0)*SIM : Date.now();

/* ================================ helpers ================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); }
const todayISO = () => iso(new Date(now()));
function niceDate(s, long){ return parseISO(s).toLocaleDateString(isDE()?"de-DE":"en-GB", long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"}); }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; }
function fmtPace(spk){ if(!spk || !isFinite(spk) || spk>1800) return "–:––"; spk=Math.round(spk); return `${Math.floor(spk/60)}:${String(spk%60).padStart(2,"0")}`; }
function sayPace(spk){ spk=Math.round(spk); const m=Math.floor(spk/60), s=spk%60; if(isDE()) return `${m} ${String(s).padStart(2,"0")}`; return s===0 ? `${m} flat` : `${m} ${s<10?"oh "+s:s}`; }
function sayDur(sec){ sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; if(!m) return `${s} seconds`; return s ? `${m} ${m===1?"minute":"minutes"} ${s}` : `${m} ${m===1?"minute":"minutes"}`; }
function fmtKm(m){ return (m/1000).toFixed(m<10000?2:1); }
function parseHMS(s){ const p=String(s||"").trim().split(":").map(Number); if(!p.length||p.some(isNaN)) return 0; return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60; }
function hav(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r; const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }

/* ================================ storage ================================ */
const DB = {
  db:null,
  open(){ return new Promise((res)=>{ try{ const r=indexedDB.open("pp-run",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); r.result.createObjectStore("runs",{keyPath:"id"}); };
    r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false); }catch(e){ res(false); } }); },
  _t(store, mode, fn){ return new Promise((res,rej)=>{ if(!this.db) return res(null); const tx=this.db.transaction(store,mode); const st=tx.objectStore(store); const q=fn(st); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); },
  get(k){ return this._t("kv","readonly",s=>s.get(k)); },
  set(k,v){ return this._t("kv","readwrite",s=>s.put(v,k)); },
  del(k){ return this._t("kv","readwrite",s=>s.delete(k)); },
  runs(){ return this._t("runs","readonly",s=>s.getAll()); },
  putRun(r){ return this._t("runs","readwrite",s=>s.put(r)); },
  delRun(id){ return this._t("runs","readwrite",s=>s.delete(id)); }
};

"Arm swings and shoulder squeezes":"Armschwünge und Schulterblatt-Ziehen","Swing your arms open wide and squeeze your shoulder blades together, then cross them in front.":"Arme weit öffnen und die Schulterblätter zusammenziehen, dann vor dem Körper kreuzen.",
"High knees":"Kniehebelauf","Feet shoulder-width, squat to about knee height.":"Füße schulterbreit, bis etwa Kniehöhe in die Hocke.","Jump explosively, arms swinging up.":"Explosiv springen, Arme schwingen mit nach oben.","Land softly on the balls of your feet and sink straight into the next one.":"Weich auf den Fußballen landen und direkt in den nächsten gehen.","Back flat against the wall, slide down until your knees are at 90 degrees.":"Rücken flach an der Wand, runterrutschen, bis die Knie 90 Grad haben.","Knees over your ankles, weight in your heels.":"Knie über den Knöcheln, Gewicht auf den Fersen.","Breathe and hold.":"Atmen und halten.","Lie under a sturdy table, grab the edge with both hands.":"Unter einen stabilen Tisch legen, die Kante mit beiden Händen greifen.","Body straight from heels to head, pull your chest to the table.":"Körper gerade von den Fersen bis zum Kopf, Brust zum Tisch ziehen.","Lower slowly. Bend your knees to make it easier.":"Langsam ablassen. Mit gebeugten Knien wird es leichter.","Hands on the front edge of a stable chair, fingers forward.":"Hände auf die vordere Kante eines stabilen Stuhls, Finger nach vorn.","Lower until your elbows are at 90 degrees, shoulders down.":"Absenken, bis die Ellbogen 90 Grad haben, Schultern unten.","Press back up. Bent knees make it easier.":"Wieder hochdrücken. Mit gebeugten Knien wird es leichter.","Stand on one leg, soft knee.":"Auf einem Bein stehen, Knie leicht gebeugt.","Hinge forward with a long back while the free leg reaches back.":"Mit langem Rücken vorbeugen, das freie Bein streckt nach hinten.","Squeeze the glute of the standing leg to come up.":"Zum Aufrichten den Po des Standbeins anspannen.","Low back pressed into the floor.":"Unterer Rücken in den Boden gedrückt.","Arms and legs reach away, shoulders slightly off the floor.":"Arme und Beine strecken weg, Schultern leicht vom Boden.","Bend your knees to make it easier.":"Knie beugen macht es leichter.","Stand a small step from the box, swing your arms back.":"Einen kleinen Schritt vor der Box stehen, Arme nach hinten schwingen.","Jump up and land softly with both feet, knees out.":"Hochspringen und weich mit beiden Füßen landen, Knie nach außen.","Stand up fully, then step down. Never jump down.":"Ganz aufrichten, dann heruntersteigen. Nie herunterspringen.","Dumbbells at your sides, tall chest.":"Kurzhanteln seitlich, Brust aufrecht.","Long step forward, back knee toward the floor.":"Großer Schritt nach vorn, hinteres Knie Richtung Boden.","Push through the front heel and step into the next lunge.":"Über die vordere Ferse drücken und in den nächsten Ausfallschritt gehen.","Stand side-on to the cable or band, handle at your chest.":"Seitlich zum Kabel oder Band stehen, Griff an der Brust.","Press straight out and hold 2 seconds without twisting.":"Gerade nach vorn drücken und 2 Sekunden halten, ohne zu drehen.","Bring it back slowly. Hips and shoulders stay square.":"Langsam zurückführen. Hüfte und Schultern bleiben gerade.","Moderate resistance, seated or standing.":"Mittlerer Widerstand, im Sitzen oder Stehen.","All-out for the whole interval.":"Volle Kraft über das ganze Intervall.","Pedal easy during the rest.":"In der Pause locker treten.","Ball overhead on your toes.":"Ball über dem Kopf, auf den Zehenspitzen.","Slam it down hard in front of your feet, hinging at the hips.":"Kräftig vor die Füße schmettern, aus der Hüfte beugen.","Catch it on the bounce or pick it up with a flat back.":"Beim Abprallen fangen oder mit geradem Rücken aufheben.","Dumbbells at your shoulders.":"Kurzhanteln auf Schulterhöhe.","Dip slightly at the knees, then drive up and press overhead.":"Leicht in die Knie gehen, dann hochdrücken und über den Kopf stoßen.","Lower to your shoulders with control.":"Kontrolliert zu den Schultern absenken.","Knee and hand on the bench, flat back.":"Knie und Hand auf der Bank, gerader Rücken.","Pull the dumbbell to your hip, elbow close.":"Kurzhantel zur Hüfte ziehen, Ellbogen nah am Körper.","Lower slowly all the way.":"Langsam ganz absenken.","Heavy weights at your sides, stand tall.":"Schwere Gewichte seitlich, aufrecht stehen.","Walk with short, quick steps, shoulders down.":"Mit kurzen, schnellen Schritten gehen, Schultern unten.","Don't let the weights swing.":"Die Gewichte nicht schwingen lassen.","Feet hip-width, swing your arms back.":"Füße hüftbreit, Arme nach hinten schwingen.","Jump forward as far as you can.":"So weit wie möglich nach vorn springen.","Land softly with bent knees and hold the landing for a second.":"Weich mit gebeugten Knien landen und die Landung eine Sekunde halten.","Weight held at your chest, wide stance.":"Gewicht vor der Brust, weiter Stand.","Shift your hips back and to one side, other leg straight.":"Hüfte nach hinten und zu einer Seite schieben, anderes Bein gestreckt.","Push back to the middle.":"Zurück in die Mitte drücken.","Hike the kettlebell back between your legs, flat back.":"Kettlebell zwischen den Beinen nach hinten schwingen, gerader Rücken.","Snap your hips forward to swing it to chest height.":"Hüfte explosiv nach vorn bringen und bis Brusthöhe schwingen.","Arms just guide it. The power comes from your hips.":"Die Arme führen nur. Die Kraft kommt aus der Hüfte.","Leap sideways onto one leg.":"Seitlich auf ein Bein springen.","Land softly and hold for a moment.":"Weich landen und kurz halten.","Leap back to the other side.":"Zurück zur anderen Seite springen.","Side plank with your top knee on a bench.":"Seitstütz mit dem oberen Knie auf einer Bank.","Lift your hips and bottom leg up to the bench.":"Hüfte und unteres Bein zur Bank anheben.","Hold, hips in one line.":"Halten, Hüfte in einer Linie.","Run on the spot, knees up to hip height, quick arms.":"Auf der Stelle laufen, Knie bis Hüfthöhe, schnelle Arme.","High plank, jump your feet out and in, hips steady.":"Hoher Stütz, Füße raus und rein springen, Hüfte ruhig.","Lunge, jump and switch legs in the air, land softly.":"Ausfallschritt, springen und in der Luft die Beine wechseln, weich landen.","Pre-run mobility":"Mobility vor dem Laufen","No equipment. A wall or post for balance helps.":"Kein Equipment. Eine Wand oder ein Pfosten zum Festhalten hilft.","Ankle rocks":"Sprunggelenk-Mobilisation","Foot a hand's width from a wall, drive your knee forward over your toes, heel stays down.":"Fuß eine Handbreit vor der Wand, Knie über die Zehen nach vorn schieben, Ferse bleibt unten.","Walking knee hugs":"Knie zur Brust im Gehen","Pull one knee to your chest, rise onto the toes of the other foot, switch.":"Ein Knie zur Brust ziehen, auf die Zehen des anderen Fußes gehen, wechseln.","Big step to the side, sit back into that hip, other leg straight.":"Großer Schritt zur Seite, in diese Hüfte setzen, anderes Bein gestreckt.","Calf raises":"Wadenheben","Rise up slowly on both feet, lower with control.":"Langsam auf beide Zehenspitzen hoch, kontrolliert absenken.","A-skips":"Kniehebe-Skippings (A-Skips)","Skip on the spot or forward. Knee up, quick, light foot contact.":"Auf der Stelle oder vorwärts hüpfen. Knie hoch, kurzer, leichter Bodenkontakt.","Butt kicks":"Anfersen","Light jog, heels up toward your glutes.":"Locker laufen, Fersen Richtung Po.","Skip to the run":"Weiter zum Lauf","Optional · about {m} min · no equipment":"Optional · etwa {m} Min. · ohne Equipment","Loosens ankles, hips and calves before you head out. The GPS keeps searching meanwhile.":"Lockert Sprunggelenke, Hüfte und Waden, bevor es losgeht. GPS sucht währenddessen weiter.","Mobility done. Start your run when the dot is green.":"Mobility fertig. Starte den Lauf, wenn der Punkt grün ist.","Okay, straight to the run. Start when the dot is green.":"Okay, direkt zum Lauf. Starte, wenn der Punkt grün ist.","Superman pulls":"Superman-Zug (Latzug in Bauchlage)","Lie face down, arms stretched overhead, chest and arms slightly off the floor.":"Auf den Bauch legen, Arme über dem Kopf gestreckt, Brust und Arme leicht vom Boden.","Pull your elbows down to your ribs, squeeze your shoulder blades together and hold 2 seconds.":"Ellbogen zu den Rippen ziehen, Schulterblätter zusammendrücken und 2 Sekunden halten.","Reach forward again without touching down.":"Wieder nach vorn strecken, ohne abzulegen.","Lie face down, arms at your sides, palms down, forehead on a towel.":"Auf den Bauch legen, Arme neben dem Körper, Handflächen nach unten, Stirn auf einem Handtuch.","Lift your arms and sweep them in a wide arc up overhead, hovering off the floor.":"Arme anheben und in einem weiten Bogen über den Kopf führen, knapp über dem Boden.","Sweep back to your hips. Shoulders stay away from your ears.":"Zurück zur Hüfte führen. Schultern weg von den Ohren.","Pull-up bar, or a low bar for rows":"Klimmzugstange oder eine niedrige Stange zum Rudern","Pull-ups: start from a full hang. Rows: body straight under a low bar.":"Klimmzüge: aus dem ganzen Hang. Rudern: Körper gerade unter einer niedrigen Stange.","Floor space, a mat, a chair or sofa, a wall":"Platz auf dem Boden, eine Matte, ein Stuhl oder Sofa, eine Wand","Copenhagen plank, short lever":"Adduktoren-Seitstütz, Knie aufgelegt","Mat; a bench or sofa for the Copenhagen plank":"Matte; eine Bank oder ein Sofa für den Adduktoren-Seitstütz","Adductor rock-back":"Adduktoren-Dehnung im Vierfüßlerstand","Standing leg raise hold":"Gestrecktes Bein im Stand halten","Hip abduction":"Abduktoren-Maschine","Pigeon pose":"Taube (Yoga-Hüftdehnung)","Lizard pose":"Eidechse (Yoga-Hüftdehnung)","A-skips":"Skippings","Butterfly":"Schmetterlingssitz","90/90 lift-offs":"90/90-Sitz, Bein anheben","Hip CARs":"Kontrolliertes Hüftkreisen","Inchworms":"Raupe (Inchworms)","Bird dog":"Vierfüßlerstand, Arm und Bein diagonal strecken","Thread the needle":"Einfädeln (Rotation im Vierfüßlerstand)","Military plank":"Stütz hoch und runter (Military Plank)","Plank jacks":"Hampelmann im Stütz","Shoulder taps":"Schulter antippen im Stütz","Bike sprints":"Sprints auf dem Fahrradergometer","Open book rotations":"Aufklappen in Seitlage (Open Book)","Dead bug":"Toter Käfer (Dead Bug)","Medicine ball slams":"Medizinball auf den Boden schmettern","Seated pike leg lifts":"Beinheben im Langsitz","Middle split slide":"Seitspagat, langsam hineingleiten","Contract-relax half split":"Halber Spagat, anspannen und entspannen","Pilates Princess":"Pilates Princess","Just a mat":"Nur eine Matte","Mat Pilates for a strong core, sculpted glutes and legs, toned arms and a tall posture. Slow and controlled, low impact. Four sessions (core, booty, arms & back, full-body flow) that get longer and tougher every month. About 30 minutes.":"Matten-Pilates für eine starke Körpermitte, definierten Po und Beine, straffe Arme und eine aufrechte Haltung. Langsam und kontrolliert, gelenkschonend. Vier Einheiten (Core, Po, Arme & Rücken, Ganzkörper-Flow), die jeden Monat länger und fordernder werden. Etwa 30 Minuten.","3–4 days":"3–4 Tage","Pick 3 or 4 days.":"Wähle 3 oder 4 Tage.","With 3 days the four sessions rotate, so you get each one regularly.":"Bei 3 Tagen wechseln sich die vier Einheiten ab, so kommt jede regelmäßig dran.","4 sessions a week, spread across these days.":"4 Einheiten pro Woche, verteilt auf diese Tage.","Powerhouse":"Körpermitte (Powerhouse)","Sculpt":"Formen","Upper body":"Oberkörper","Flow":"Flow","Stretch":"Dehnen","Pilates breathing":"Pilates-Atmung","On your back, knees bent. Breathe into the sides of your ribs, then exhale and draw your belly button in.":"Rückenlage, Knie gebeugt. In die Flanken atmen, beim Ausatmen den Bauchnabel nach innen ziehen.","Pelvic tilts":"Becken kippen","Flatten your low back into the mat, then gently arch. Small and slow.":"Unteren Rücken in die Matte drücken, dann sanft ins Hohlkreuz. Klein und langsam.","Spine roll-down":"Abrollen der Wirbelsäule","Stand tall, chin to chest, roll down one vertebra at a time and roll back up.":"Aufrecht stehen, Kinn zur Brust, Wirbel für Wirbel abrollen und wieder aufrollen.","Toe taps":"Fußtipper","On your back, legs in tabletop. Lower one foot to tap the floor, low back stays down.":"Rückenlage, Beine im 90-Grad-Winkel. Einen Fuß zum Boden tippen, unterer Rücken bleibt unten.","Supine spinal twist":"Drehdehnung in Rückenlage","On your back, drop both knees to one side, arms wide, look the other way.":"Rückenlage, beide Knie zu einer Seite fallen lassen, Arme weit, zur anderen Seite schauen.","The hundred":"The Hundred (Hunderter)","Head and shoulders up, legs in tabletop or long. Pump your arms: breathe in for 5, out for 5.":"Kopf und Schultern hoch, Beine angewinkelt oder lang. Arme pumpen: 5 Schläge einatmen, 5 ausatmen.","Roll-ups":"Aufrollen (Roll-up)","Arms overhead, peel up one vertebra at a time, reach for your toes, roll back down slowly.":"Arme über dem Kopf, Wirbel für Wirbel hochrollen, zu den Zehen greifen, langsam wieder abrollen.","Single-leg stretch":"Single Leg Stretch (Beinwechsel)","Head up, pull one knee in while the other leg reaches long. Switch with control.":"Kopf hoch, ein Knie heranziehen, das andere Bein lang strecken. Kontrolliert wechseln.","Double-leg stretch":"Double Leg Stretch (Arme und Beine strecken)","Hug both knees, then reach arms and legs long at the same time. Circle the arms back and hug again.":"Beide Knie umarmen, dann Arme und Beine gleichzeitig lang strecken. Arme zurückkreisen und wieder umarmen.","Criss-cross":"Criss-Cross (Ellbogen zum Knie)","Hands behind your head, elbow toward the opposite knee, other leg long. Slow and twisting.":"Hände hinter dem Kopf, Ellbogen zum gegenüberliegenden Knie, anderes Bein lang. Langsam drehen.","Single-leg circles":"Beinkreise","One leg to the ceiling, draw small circles. Hips stay still.":"Ein Bein zur Decke, kleine Kreise zeichnen. Hüfte bleibt ruhig.","Teaser":"V-Sitz (Teaser)","Teaser prep":"Teaser-Vorübung","Roll up into a V, arms parallel to your legs, then roll down with control.":"In den V-Sitz hochrollen, Arme parallel zu den Beinen, kontrolliert abrollen.","Feet on the floor, roll up into a V with arms reaching forward, then roll back down.":"Füße am Boden, mit nach vorn gestreckten Armen in den V-Sitz rollen, dann wieder abrollen.","Forearm plank":"Unterarmstütz","Elbows under shoulders, long line, belly button in, squeeze your inner thighs.":"Ellbogen unter den Schultern, lange Linie, Bauchnabel rein, Innenschenkel zusammendrücken.","Peel your spine up, squeeze your glutes, lower one vertebra at a time.":"Wirbelsäule hochrollen, Po anspannen, Wirbel für Wirbel absenken.","Bridge pulses":"Brücke mit Pulsen","Hold the bridge high and pulse up a few centimetres. Keep squeezing.":"Brücke hoch halten und ein paar Zentimeter nach oben pulsieren. Po angespannt lassen.","Clamshells":"Muschel (Clamshell)","Lie on your side, knees bent, heels together. Open the top knee without rolling back.":"Seitlage, Knie gebeugt, Fersen zusammen. Oberes Knie öffnen, ohne nach hinten zu kippen.","Long top leg, toes forward, lift and lower slowly.":"Oberes Bein lang, Zehen nach vorn, langsam heben und senken.","Inner thigh lifts":"Innenschenkel heben","Top foot on the floor in front, lift the bottom leg in small pulses.":"Oberen Fuß vorne aufstellen, unteres Bein in kleinen Pulsen heben.","Donkey kicks":"Donkey Kicks (Bein nach oben drücken)","On all fours, knee bent, press the foot to the ceiling. Don't arch your back.":"Vierfüßlerstand, Knie gebeugt, Fuß Richtung Decke drücken. Kein Hohlkreuz.","Fire hydrants":"Fire Hydrants (Knie seitlich heben)","On all fours, lift the bent knee out to the side. Hips stay level.":"Vierfüßlerstand, gebeugtes Knie zur Seite heben. Hüfte bleibt gerade.","Plié squat pulses":"Plié-Kniebeuge mit Pulsen","Wide stance, toes out, sink low and pulse. Heels can lift for more burn.":"Weiter Stand, Zehen nach außen, tief sinken und pulsieren. Für mehr Brennen die Fersen heben.","Single-leg bridge pulses":"Einbeinige Brücke mit Pulsen","One foot on the floor, other leg long. Lift your hips and keep them level.":"Ein Fuß am Boden, anderes Bein lang. Hüfte heben und gerade halten.","Swimming":"Schwimmen (Swimming)","Face down, arms and legs long and lifted. Flutter opposite arm and leg quickly, breathe.":"Bauchlage, Arme und Beine lang und angehoben. Gegengleich schnell flattern, weiter atmen.","Swan prep":"Schwan-Vorübung","Face down, hands by your shoulders. Lift your chest using your back, not your arms. Lower slowly.":"Bauchlage, Hände neben den Schultern. Brust mit dem Rücken heben, nicht mit den Armen. Langsam ablegen.","Pilates push-ups":"Pilates-Liegestütze","Knees or toes, elbows close to your ribs. Lower slowly, press up.":"Auf Knien oder Zehen, Ellbogen nah an den Rippen. Langsam absenken, hochdrücken.","Kneeling tall, arms out to the sides. Small circles, change direction halfway.":"Aufrecht knien, Arme seitlich. Kleine Kreise, nach der Hälfte Richtung wechseln.","Side plank hip dips":"Seitstütz mit Hüftsenken","Forearm side plank, lower your hip toward the floor and lift it high again.":"Seitstütz auf dem Unterarm, Hüfte Richtung Boden senken und wieder hoch heben.","Face down, lift arms in a Y, then a T. Squeeze your shoulder blades.":"Bauchlage, Arme als Y heben, dann als T. Schulterblätter zusammendrücken.","Leg pull front":"Stütz mit Beinheben","High plank, lift one leg at a time without moving your hips.":"Hoher Stütz, abwechselnd ein Bein heben, ohne die Hüfte zu bewegen.","High plank, feet wide, tap the opposite shoulder. Hips stay still.":"Hoher Stütz, Füße weit, gegenüberliegende Schulter antippen. Hüfte bleibt ruhig.","Saw":"Säge (Saw)","Sit tall, legs wide, twist and reach your hand past the opposite little toe.":"Aufrecht sitzen, Beine weit, drehen und mit der Hand am kleinen Zeh des anderen Fußes vorbeigreifen.","Spine twist":"Wirbelsäulen-Drehung im Sitzen","Sit tall, arms out to the sides, twist from your waist, hips stay still.":"Aufrecht sitzen, Arme seitlich, aus der Taille drehen, Hüfte bleibt ruhig.","Side kick front and back":"Seitlage: Bein vor und zurück","Lie on your side, top leg at hip height. Kick forward twice, then sweep back long.":"Seitlage, oberes Bein auf Hüfthöhe. Zweimal nach vorn kicken, dann lang nach hinten führen.","Mermaid stretch":"Meerjungfrau-Dehnung","Sit with legs to one side, reach your arm overhead and lean into a long side stretch.":"Mit den Beinen zu einer Seite sitzen, Arm über den Kopf strecken und lang zur Seite neigen.","Voice on":"Stimme an","Voice off":"Stimme aus","Voice coach":"Sprachcoach","Speaks every exercise and countdown.":"Sagt jede Übung und jeden Countdown an.","Silent, beeps only.":"Stumm, nur Pieptöne.","Voice coach on.":"Sprachcoach an.","Pilates · Core & powerhouse · month 1":"Pilates · Core & Powerhouse · Monat 1","Pilates · Booty & legs · month 1":"Pilates · Po & Beine · Monat 1","Pilates · Arms, back & posture · month 1":"Pilates · Arme, Rücken & Haltung · Monat 1","Pilates · Full-body flow · month 1":"Pilates · Ganzkörper-Flow · Monat 1","Pilates · Core & powerhouse · month 2":"Pilates · Core & Powerhouse · Monat 2","Pilates · Booty & legs · month 2":"Pilates · Po & Beine · Monat 2","Pilates · Arms, back & posture · month 2":"Pilates · Arme, Rücken & Haltung · Monat 2","Pilates · Full-body flow · month 2":"Pilates · Ganzkörper-Flow · Monat 2","Pilates · Core & powerhouse · month 3":"Pilates · Core & Powerhouse · Monat 3","Pilates · Booty & legs · month 3":"Pilates · Po & Beine · Monat 3","Pilates · Arms, back & posture · month 3":"Pilates · Arme, Rücken & Haltung · Monat 3","Pilates · Full-body flow · month 3":"Pilates · Ganzkörper-Flow · Monat 3","You are stronger than you think.":"Du bist stärker, als du denkst.","Every step counts, including the small ones.":"Jeder Schritt zählt, auch die kleinen.","Your body can do amazing things. Be kind to it.":"Dein Körper kann Großartiges. Sei gut zu ihm.","Progress, not perfection.":"Fortschritt, nicht Perfektion.","You don't have to be fast. You just have to start.":"Du musst nicht schnell sein. Du musst nur anfangen.","Rest is part of training, too.":"Pause gehört auch zum Training.","Showing up is the hardest part, and you're good at it.":"Dranbleiben ist das Schwerste, und du kannst das.","Strong looks good on you.":"Stärke steht dir.","Today is a good day to be proud of yourself.":"Heute ist ein guter Tag, um stolz auf dich zu sein.","Your only competition is who you were yesterday.":"Deine einzige Konkurrenz ist dein Ich von gestern.","Breathe in courage, breathe out doubt.":"Mut einatmen, Zweifel ausatmen.","Little by little, you're getting there.":"Stück für Stück kommst du ans Ziel.","What you do today is a gift to your future self.":"Was du heute tust, ist ein Geschenk an dein zukünftiges Ich.","You can do hard things.":"Du kannst schwierige Dinge schaffen.","Listen to your body. It's on your side.":"Hör auf deinen Körper. Er ist auf deiner Seite.","Consistency beats intensity.":"Regelmäßigkeit schlägt Intensität.","You're building something great, one session at a time.":"Du baust etwas Großartiges auf, Einheit für Einheit.","Be proud of how far you've come.":"Sei stolz darauf, wie weit du schon gekommen bist.","Slow kilometres are still kilometres.":"Langsame Kilometer sind auch Kilometer.","Your pace, your rules.":"Dein Tempo, deine Regeln.","You're doing better than you think.":"Du machst das besser, als du denkst.","Movement is a celebration of what your body can do.":"Bewegung ist ein Fest dafür, was dein Körper kann.","Confidence grows with every rep.":"Selbstvertrauen wächst mit jeder Wiederholung.","Today you choose yourself.":"Heute entscheidest du dich für dich.","Happy body, happy mind.":"Glücklicher Körper, glücklicher Kopf.","Strong, calm and focused. That's you.":"Stark, ruhig und fokussiert. Das bist du.","A good day starts with a kind thought about yourself.":"Ein guter Tag beginnt mit einem freundlichen Gedanken über dich selbst.","You don't give up. That's your superpower.":"Du gibst nicht auf. Das ist deine Superkraft.","Every session makes you a little stronger.":"Jede Einheit macht dich ein bisschen stärker.","You deserve to feel good in your body.":"Du verdienst es, dich in deinem Körper wohlzufühlen.","Great job!":"Super gemacht!","Well done!":"Gut gemacht!","You did it!":"Geschafft!","Strong work!":"Stark!","So proud of you!":"So stolz auf dich!","Amazing effort!":"Was für ein Einsatz!","You showed up for yourself today.":"Heute hast du dich für dich entschieden.","Another one in the bag.":"Wieder eine geschafft.","Your future self says thank you.":"Dein zukünftiges Ich sagt Danke.","Consistency like this pays off.":"So eine Beständigkeit zahlt sich aus.","Today's affirmation":"Affirmation des Tages","Another one":"Noch eine","Everything for today is done. Well done!":"Alles für heute erledigt. Gut gemacht!","Now a little core would be perfect!":"Jetzt noch ein bisschen Core wäre perfekt!","About {m} minutes, while your muscles are still warm.":"Etwa {m} Minuten, solange deine Muskeln noch warm sind.","Yes, let's go":"Ja, los geht's","No, straight to stretching":"Nein, direkt zum Dehnen","Skip for now":"Jetzt nicht","Now: stretching":"Jetzt: Dehnen","Stretching can help prevent injuries and ease sore muscles. About {m} minutes.":"Dehnen kann helfen, Verletzungen vorzubeugen, und mindert den Muskelkater. Etwa {m} Minuten.","Start stretching":"Dehnen starten","Not today":"Heute nicht","Core done. Well done!":"Core geschafft. Gut gemacht!","Okay, straight to stretching.":"Okay, direkt zum Dehnen.","All done for today!":"Alles erledigt für heute!","Run, core and stretching. Your body says thank you.":"Laufen, Core und Dehnen. Dein Körper sagt Danke.","Run and stretching. Your body says thank you.":"Laufen und Dehnen. Dein Körper sagt Danke.","Close":"Schließen","Run finished.":"Lauf beendet.","Run saved.":"Lauf gespeichert.","Time to stretch.":"Zeit zum Dehnen.","Done!":"Geschafft!","Workout done. Great work.":"Training geschafft. Starke Arbeit.","holds":"Halten","reps":"Wiederholungen","Guided":"Geführt","Overview":"Übersicht","View":"Ansicht","Skip rest":"Pause überspringen","Finish set":"Satz beenden","Next: {n}, set {k}":"Als Nächstes: {n}, Satz {k}","Next: {n}":"Als Nächstes: {n}","Rest over.":"Pause vorbei.","All sets are ticked. Tap Finish workout.":"Alle Sätze sind abgehakt. Tippe auf Training beenden.","Skip":"Überspringen","Good":"Gut","10 seconds.":"10 Sekunden.","Hands on a wall, one foot back, heel pressed into the floor.":"Hände an die Wand, ein Fuß nach hinten, Ferse in den Boden drücken.","Keep the back knee straight and lean your hips toward the wall.":"Hinteres Knie gestreckt lassen und die Hüfte Richtung Wand schieben.","You should feel it in the upper calf. Breathe slowly, don't bounce.":"Du spürst es in der oberen Wade. Ruhig atmen, nicht wippen.","Same position as the calf stretch, but step the back foot a little closer.":"Gleiche Position wie bei der Wadendehnung, hinteren Fuß etwas näher setzen.","Bend the back knee and sink down, heel stays on the floor.":"Hinteres Knie beugen und tiefer sinken, Ferse bleibt am Boden.","You'll feel it lower, just above the Achilles tendon.":"Du spürst es weiter unten, knapp über der Achillessehne.","Kneel on one knee, other foot in front, both knees at about 90 degrees.":"Auf ein Knie gehen, anderer Fuß vorne, beide Knie etwa im 90-Grad-Winkel.","Tuck your tailbone under and squeeze the glute of the back leg.":"Steißbein einrollen und den Po des hinteren Beins anspannen.","Shift forward a little until you feel the front of the back hip. Stay tall.":"Etwas nach vorn schieben, bis du die Vorderseite der hinteren Hüfte spürst. Aufrecht bleiben.","Stand on one leg, hold a wall if you need to.":"Auf einem Bein stehen, bei Bedarf an der Wand festhalten.","Pull your heel toward your glute, knees close together.":"Ferse Richtung Po ziehen, Knie nah beieinander.","Push your hips slightly forward to feel the front of the thigh more.":"Hüfte leicht nach vorn schieben, dann spürst du die Oberschenkelvorderseite mehr.","Kneel on one knee on a soft surface, other foot in front.":"Auf ein Knie auf weicher Unterlage, anderer Fuß vorne.","Reach back and hold the back foot, pull it gently toward your glute.":"Nach hinten greifen, den hinteren Fuß halten und sanft zum Po ziehen.","Keep your hips square and tuck your pelvis. Feel the front of the thigh.":"Hüfte gerade, Becken einrollen. Du spürst die Oberschenkelvorderseite.","Lie on your back, loop a towel or strap around one foot.":"Auf den Rücken legen, Handtuch oder Gurt um einen Fuß legen.","Raise that leg as straight as you can, the other leg stays long on the floor.":"Das Bein möglichst gestreckt anheben, das andere bleibt lang am Boden.","Pull gently until you feel the back of the thigh. Relax your shoulders.":"Sanft ziehen, bis du die Oberschenkelrückseite spürst. Schultern locker.","Lie on your back, hold one leg behind the thigh or calf.":"Auf den Rücken legen, ein Bein hinter Oberschenkel oder Wade halten.","Straighten the knee as much as feels good, the other leg stays long.":"Knie so weit strecken, wie es sich gut anfühlt, das andere Bein bleibt lang.","Feel the back of the thigh. Breathe out and let it relax a little more.":"Du spürst die Oberschenkelrückseite. Ausatmen und noch etwas mehr loslassen.","Lie on your back, cross one ankle over the opposite knee.":"Rückenlage, einen Knöchel über das andere Knie legen.","Reach through and pull the bottom thigh toward your chest.":"Durchgreifen und den unteren Oberschenkel zur Brust ziehen.","Push the top knee gently away. You'll feel it deep in the glute.":"Oberes Knie sanft wegschieben. Du spürst es tief im Po.","From all fours, bring one knee forward behind your wrist, shin across.":"Aus dem Vierfüßlerstand ein Knie hinter das Handgelenk bringen, Schienbein quer.","Slide the other leg long behind you and square your hips.":"Das andere Bein lang nach hinten schieben, Hüfte gerade ausrichten.","Stay up on your hands or fold forward. Feel the outer hip and glute. Knee pain means back off.":"Auf den Händen bleiben oder nach vorn ablegen. Du spürst äußere Hüfte und Po. Bei Knieschmerz zurückgehen.","Kneel on all fours, stretch one leg straight out to the side, foot flat.":"Vierfüßlerstand, ein Bein gestreckt zur Seite, Fuß flach am Boden.","Keep your back long and rock your hips slowly back toward your heel.":"Rücken lang lassen und die Hüfte langsam Richtung Ferse schieben.","Feel the inner thigh. Rock forward and back, going a little deeper each time.":"Du spürst die Innenseite des Oberschenkels. Vor und zurück, jedes Mal etwas tiefer.","Kneel, big toes together, knees wide.":"Knien, große Zehen zusammen, Knie weit.","Sink your hips toward your heels and walk your hands forward.":"Hüfte Richtung Fersen sinken lassen, Hände nach vorn laufen.","Rest your forehead down and breathe into your back.":"Stirn ablegen und in den Rücken atmen.","Start in child's pose, arms long in front.":"In der Kindhaltung beginnen, Arme lang nach vorn.","Walk both hands to one side and keep your hips down.":"Beide Hände zu einer Seite laufen, Hüfte bleibt unten.","Feel the side of your back. Halfway through, switch sides.":"Du spürst die Seite des Rückens. Nach der Hälfte die Seite wechseln.","On all fours, hands under shoulders, knees under hips.":"Vierfüßlerstand, Hände unter den Schultern, Knie unter der Hüfte.","Breathe in: drop your belly, lift chest and tailbone.":"Einatmen: Bauch sinken lassen, Brust und Steißbein heben.","Breathe out: round your back, tuck chin and tailbone. Move slowly.":"Ausatmen: Rücken rund machen, Kinn und Steißbein einrollen. Langsam bewegen.","Sit with both knees bent at 90 degrees, both falling to the same side.":"Sitzen, beide Knie im 90-Grad-Winkel, beide zur gleichen Seite gekippt.","Sit tall and rotate both knees over to the other side, feet stay planted.":"Aufrecht sitzen und beide Knie zur anderen Seite drehen, Füße bleiben stehen.","Use your hands behind you for support if you need to. Slow and controlled.":"Bei Bedarf hinten mit den Händen abstützen. Langsam und kontrolliert.","Step into a long lunge and put both hands on the floor inside the front foot.":"Großer Ausfallschritt, beide Hände innen neben den vorderen Fuß.","Drop the elbow toward the front foot's instep, then rotate that arm up to the ceiling.":"Ellbogen Richtung Fußrist senken, dann den Arm zur Decke aufdrehen.","Follow your hand with your eyes, come back and repeat. Back leg stays long.":"Mit dem Blick der Hand folgen, zurück und wiederholen. Hinteres Bein bleibt lang.","From a low lunge, put both hands inside the front foot.":"Aus dem tiefen Ausfallschritt beide Hände innen neben den vorderen Fuß.","Lower the back knee and sink your hips down and forward.":"Hinteres Knie ablegen, Hüfte nach unten und vorn sinken lassen.","Stay on your hands or come down to your forearms. Feel the hip and groin.":"Auf den Händen bleiben oder auf die Unterarme gehen. Du spürst Hüfte und Leiste.","Step one foot forward and lower the back knee to the floor.":"Einen Fuß nach vorn, hinteres Knie zum Boden.","Hands on the front thigh or overhead, chest tall.":"Hände auf den vorderen Oberschenkel oder über den Kopf, Brust aufrecht.","Let your hips sink forward. Feel the front of the back hip.":"Hüfte nach vorn sinken lassen. Du spürst die Vorderseite der hinteren Hüfte.","On all fours, slide your knees wide apart, ankles in line with the knees.":"Vierfüßlerstand, Knie weit auseinander, Knöchel auf Höhe der Knie.","Come down to your forearms and slowly push your hips back.":"Auf die Unterarme gehen und die Hüfte langsam nach hinten schieben.","Feel the inner thighs. Use a soft surface under your knees.":"Du spürst die Innenschenkel. Weiche Unterlage unter die Knie.","Sit tall, soles of the feet together, knees falling out.":"Aufrecht sitzen, Fußsohlen zusammen, Knie fallen nach außen.","Hold your feet and lengthen your spine.":"Füße halten und die Wirbelsäule lang machen.","Hinge forward from the hips with a long back. Feel the inner thighs.":"Mit langem Rücken aus der Hüfte nach vorn beugen. Du spürst die Innenschenkel.","Kneel on one knee, front leg straight out, heel on the floor, toes up.":"Auf ein Knie, vorderes Bein gestreckt, Ferse am Boden, Zehen hoch.","Shift your hips back over the back knee, hands beside the front leg.":"Hüfte nach hinten über das hintere Knie schieben, Hände neben dem vorderen Bein.","Fold forward with a long back. Feel the back of the front thigh.":"Mit langem Rücken nach vorn beugen. Du spürst die Rückseite des vorderen Oberschenkels.","Get into the half split position.":"In die Position des halben Spagats gehen.","Press the front heel down into the floor for 5 seconds, as if pulling it back.":"Die vordere Ferse 5 Sekunden in den Boden drücken, als würdest du sie zurückziehen.","Relax, breathe out and sink a little deeper. Repeat.":"Loslassen, ausatmen und etwas tiefer sinken. Wiederholen.","Start in a low lunge, hands on the floor or on books on either side.":"Im tiefen Ausfallschritt beginnen, Hände am Boden oder auf Büchern links und rechts.","Slowly slide the front heel forward and the back knee back.":"Vordere Ferse langsam nach vorn und hinteres Knie nach hinten gleiten lassen.","Go only as far as you can breathe calmly. Hips stay square.":"Nur so weit, wie du ruhig atmen kannst. Hüfte bleibt gerade.","Stand with feet wide, toes forward, hands on the floor or on books.":"Weiter Stand, Zehen nach vorn, Hände am Boden oder auf Büchern.","Slowly slide your feet further apart, weight in your hands.":"Füße langsam weiter auseinander gleiten lassen, Gewicht auf den Händen.","Stop at a strong stretch in the inner thighs, never in the knees.":"Bei deutlicher Dehnung in den Innenschenkeln stoppen, nie in den Knien.","Sit with legs wide, knees and toes pointing up.":"Mit weit gegrätschten Beinen sitzen, Knie und Zehen zeigen nach oben.","Sit tall first, then hinge forward from your hips.":"Erst aufrichten, dann aus der Hüfte nach vorn beugen.","Walk your hands forward and breathe. Back stays long.":"Hände nach vorn laufen und atmen. Rücken bleibt lang.","Stand in a door frame, forearm on the frame, elbow at shoulder height.":"In einen Türrahmen stellen, Unterarm an den Rahmen, Ellbogen auf Schulterhöhe.","Step forward with the same-side foot until the chest opens.":"Mit dem Fuß derselben Seite nach vorn gehen, bis sich die Brust öffnet.","Keep your shoulder down and away from your ear. No tingling in the arm.":"Schulter tief und weg vom Ohr. Kein Kribbeln im Arm.","On all fours, slide one arm under your body along the floor.":"Vierfüßlerstand, einen Arm unter dem Körper am Boden durchschieben.","Rest that shoulder and the side of your head on the floor.":"Schulter und Kopfseite am Boden ablegen.","Feel the upper back between the shoulder blades. Hips stay over knees.":"Du spürst den oberen Rücken zwischen den Schulterblättern. Hüfte bleibt über den Knien.","Kneel, forearms on the floor in front of you.":"Knien, Unterarme vor dir am Boden.","Sit your hips back toward your heels.":"Hüfte zurück Richtung Fersen setzen.","Let your chest sink toward the floor and breathe. Feel your upper back open.":"Brust Richtung Boden sinken lassen und atmen. Der obere Rücken öffnet sich.","Lie on your side, knees bent in front, arms together straight in front.":"Seitlage, Knie vorne angewinkelt, Arme gestreckt übereinander vor dir.","Open the top arm across to the other side like a book, eyes follow the hand.":"Oberen Arm wie ein Buch zur anderen Seite öffnen, Blick folgt der Hand.","Knees stay together. Close slowly and repeat.":"Knie bleiben zusammen. Langsam schließen und wiederholen.","Lie on your back, arms out wide.":"Rückenlage, Arme weit zur Seite.","Bring your knees up and let them fall to one side.":"Knie anziehen und zu einer Seite fallen lassen.","Turn your head the other way and keep both shoulders down.":"Kopf zur anderen Seite drehen, beide Schultern bleiben unten.","Sit with both legs folded to one side.":"Mit beiden Beinen zu einer Seite angewinkelt sitzen.","Reach the opposite arm up and over your head.":"Den anderen Arm hoch und über den Kopf strecken.","Lean into a long side bend. Feel your waist and side of the back.":"In eine lange Seitbeuge neigen. Du spürst Taille und seitlichen Rücken.","Bring one arm straight across your chest.":"Einen Arm gestreckt vor der Brust zur anderen Seite führen.","Hold it above the elbow with the other hand and pull gently.":"Mit der anderen Hand über dem Ellbogen halten und sanft ziehen.","Shoulder stays down. Feel the back of the shoulder.":"Schulter bleibt unten. Du spürst die Rückseite der Schulter.","Reach one arm up, bend the elbow and let the hand drop behind your head.":"Einen Arm hoch, Ellbogen beugen, Hand hinter den Kopf fallen lassen.","Use the other hand to gently push the elbow back.":"Mit der anderen Hand den Ellbogen sanft nach hinten drücken.","Stand tall, ribs down. Feel the back of the upper arm.":"Aufrecht stehen, Rippen unten. Du spürst die Rückseite des Oberarms.","Sit or stand tall, shoulders relaxed.":"Aufrecht sitzen oder stehen, Schultern locker.","Tilt your ear toward your shoulder.":"Ohr Richtung Schulter neigen.","Reach the other hand down toward the floor. Gentle, never force it.":"Die andere Hand Richtung Boden strecken. Sanft, nie forcieren.","Kneel, hands on the floor, fingers pointing toward your knees.":"Knien, Hände am Boden, Finger zeigen zu den Knien.","Gently lean back to stretch the forearms.":"Sanft nach hinten lehnen, um die Unterarme zu dehnen.","Halfway through, flip the hands and press the backs of them down.":"Nach der Hälfte die Hände drehen und die Handrücken ablegen.","Stand with hands on hips, feet hip-width.":"Hände an der Hüfte, Füße hüftbreit.","Draw big, slow circles with your hips.":"Große, langsame Kreise mit der Hüfte.","Change direction halfway.":"Nach der Hälfte die Richtung wechseln.","Hold a wall or post, stand on one leg.":"An Wand oder Pfosten festhalten, auf einem Bein stehen.","Swing the free leg forward and back, relaxed.":"Das freie Bein locker vor und zurück schwingen.","Let the swing get a little bigger each time. Stay tall.":"Den Schwung jedes Mal etwas größer werden lassen. Aufrecht bleiben.","Face the wall, both hands on it.":"Zur Wand schauen, beide Hände daran.","Swing one leg across your body and out to the side.":"Ein Bein vor dem Körper vorbei und zur Seite schwingen.","Keep your hips facing the wall.":"Die Hüfte zeigt zur Wand.","Stand on one leg holding a wall, lift the other knee in front.":"Auf einem Bein an der Wand stehen, anderes Knie vorne anheben.","Open the knee out to the side, then rotate it back and down in the biggest circle you can control.":"Knie zur Seite öffnen, dann nach hinten und unten im größten kontrollierten Kreis drehen.","Upper body stays still. Then reverse the direction.":"Oberkörper bleibt ruhig. Dann Richtung wechseln.","Stand very wide, toes slightly out.":"Sehr weiter Stand, Zehen leicht nach außen.","Sit down into one leg while the other stays straight, toes up.":"In ein Bein setzen, das andere bleibt gestreckt, Zehen hoch.","Heel stays down. Go only as low as you can control, then switch.":"Ferse bleibt unten. Nur so tief, wie du kontrollieren kannst, dann wechseln.","Half-kneel facing a wall, front foot a hand's width away.":"Im Halbknien vor einer Wand, vorderer Fuß eine Handbreit entfernt.","Drive the front knee toward the wall over your toes.":"Vorderes Knie über die Zehen Richtung Wand schieben.","Heel stays down. Rock in and out slowly.":"Ferse bleibt unten. Langsam vor und zurück.","Leg & glute stretch":"Bein- & Po-Dehnung","Upper body stretch":"Oberkörper-Dehnung","Full-body stretch":"Ganzkörper-Dehnung","A mat and a wall":"Eine Matte und eine Wand","A mat and a door frame":"Eine Matte und ein Türrahmen","A mat":"Eine Matte","Hands on a wall, back heel down, knee straight.":"Hände an die Wand, hintere Ferse unten, Knie gestreckt.","Hold the back foot and pull it gently toward your glute.":"Hinteren Fuß halten und sanft zum Po ziehen.","On your back, hold one leg behind the thigh and straighten it.":"Rückenlage, ein Bein hinter dem Oberschenkel halten und strecken.","Shin across in front, back leg long, sink your hips.":"Schienbein vorne quer, hinteres Bein lang, Hüfte sinken lassen.","One leg out to the side, rock your hips back.":"Ein Bein zur Seite, Hüfte nach hinten schieben.","Forearm on the frame, step through until the chest opens.":"Unterarm an den Rahmen, durchgehen, bis sich die Brust öffnet.","Arm across your chest, pull gently above the elbow.":"Arm vor die Brust, über dem Ellbogen sanft ziehen.","Hand behind your head, push the elbow gently back.":"Hand hinter den Kopf, Ellbogen sanft nach hinten drücken.","Ear toward shoulder, other hand reaches down.":"Ohr zur Schulter, andere Hand zieht nach unten.","Fingers toward your knees, lean back gently. Then flip your hands.":"Finger zu den Knien, sanft zurücklehnen. Dann die Hände drehen.","Knees to one side, arms wide, look the other way.":"Knie zu einer Seite, Arme weit, zur anderen Seite schauen.","Lying hamstring stretch":"Beinrückseite dehnen im Liegen","Cross-body shoulder stretch":"Schulterdehnung vor der Brust","Overhead triceps stretch":"Trizepsdehnung über dem Kopf","Neck side stretch":"Seitliche Nackendehnung","Wrist stretches":"Handgelenke dehnen","Stretch what you just trained":"Dehne, was du gerade trainiert hast","{n} · about {m} min. Matched to the muscles in this workout.":"{n} · etwa {m} Min. Passend zu den Muskeln aus diesem Training.","Start stretching":"Dehnen starten","Afterwards: {n}":"Danach: {n}","Offered when you finish, matched to the muscles you trained.":"Wird dir am Ende angeboten, passend zu den trainierten Muskeln.","ends with a matching stretch":"endet mit passender Dehnung","How to do it":"So geht's","Hide":"Ausblenden","All":"Alle","Runs":"Läufe","Strength":"Kraft","Stretching & core":"Dehnen & Core","Other":"Andere","All sessions":"Alle Einheiten","Nothing here yet.":"Hier ist noch nichts.","Show more":"Mehr anzeigen","effort":"Anstrengung","guided":"geführt","sets":"Sätze","edited":"bearbeitet","Routine":"Routine","Guided session":"Geführte Einheit","Timed sessions have nothing to edit. You can delete it if it shouldn't count.":"Zeitbasierte Einheiten kann man nicht bearbeiten. Du kannst sie löschen, wenn sie nicht zählen soll.","Added weight (kg)":"Zusatzgewicht (kg)","Kg per dumbbell":"Kg pro Kurzhantel","Weight (kg)":"Gewicht (kg)","Set":"Satz","Add a set":"Satz hinzufügen","Leave a set empty to remove it.":"Lass einen Satz leer, um ihn zu entfernen.","Cancel":"Abbrechen","Close":"Schließen","Delete this workout":"Dieses Training löschen","Save changes":"Änderungen speichern","Edit":"Bearbeiten","Saved. Your next targets are updated.":"Gespeichert. Deine nächsten Ziele sind angepasst.","Saved.":"Gespeichert.","Delete":"Löschen","Do it again":"Nochmal machen","intensity":"Intensität","Delete this session?":"Diese Einheit löschen?","Open":"Öffnen","Plan complete!":"Plan geschafft!","You finished the whole plan. Run the 3 km level test to see how much faster you got, then pick your next plan.":"Du hast den ganzen Plan durchgezogen. Mach den 3-km-Leveltest, um zu sehen, wie viel schneller du geworden bist, und wähle dann deinen nächsten Plan.","12 weeks done. Repeat it one level harder, or try something new.":"12 Wochen geschafft. Wiederhole ihn eine Stufe schwerer oder probier etwas Neues.","Test your level":"Level testen","Skip the test, show what's next":"Ohne Test: zeig mir, was als Nächstes kommt","Repeat one level harder":"Eine Stufe schwerer wiederholen","Choose another plan":"Anderen Plan wählen","Keep it as it is":"So lassen","Next step: 10K: faster and further. You can already run 30 minutes, so you're ready to build to 10 km and get faster.":"Nächster Schritt: 10K schneller und weiter. Du kannst schon 30 Minuten laufen, also bist du bereit, bis 10 km aufzubauen und schneller zu werden.","Next step: Half marathon. Your 10K base is the perfect start for longer runs.":"Nächster Schritt: Halbmarathon. Deine 10K-Basis ist der perfekte Start für längere Läufe.","Or another 10K block at your new, faster level.":"Oder ein weiterer 10K-Block auf deinem neuen, schnelleren Level.","Next step: a 10K speed block. Shorter, faster training makes your next half marathon quicker too.":"Nächster Schritt: ein 10K-Tempoblock. Kürzeres, schnelleres Training macht auch deinen nächsten Halbmarathon schneller.","Or another half marathon at your new level.":"Oder noch ein Halbmarathon auf deinem neuen Level.","What's next?":"Wie geht's weiter?","You finished {n}.":"Du hast {n} abgeschlossen.","Your level now":"Dein Level jetzt","{s} faster than before":"{s} schneller als vorher","Recommended":"Empfohlen","Predicted half marathon: {t}":"Prognose Halbmarathon: {t}","Predicted 10K: {t}":"Prognose 10K: {t}","Start this plan":"Diesen Plan starten","Starting a new plan replaces the finished one. Everything you logged stays in your log.":"Ein neuer Plan ersetzt den abgeschlossenen. Alles, was du eingetragen hast, bleibt im Verlauf.","That was the last run of your plan. Your level test and your next plan are waiting on the Today screen.":"Das war der letzte Lauf deines Plans. Dein Leveltest und dein nächster Plan warten auf dem Heute-Bildschirm.","Good.":"Gut.","Rest # minutes #.":"Pause # Minuten #.","Rest # minutes.":"Pause # Minuten.","Rest # minute #.":"Pause # Minute #.","Rest # minute.":"Pause # Minute.","Rest # seconds.":"Pause # Sekunden.","Set {a} of {b}.":"Satz {a} von {b}.","With 3 days you get a long run, one interval session and an easy run. 4–5 days is ideal.":"Mit 3 Tagen bekommst du einen langen Lauf, eine Intervalleinheit und einen lockeren Lauf. 4–5 Tage sind ideal.","With 2 days you get a long run, one interval session. 4–5 days is ideal.":"Mit 2 Tagen bekommst du einen langen Lauf und eine Intervalleinheit. 4–5 Tage sind ideal.","Half marathon":"Halbmarathon","Marathon":"Marathon","the half marathon":"den Halbmarathon","the marathon":"den Marathon","{k} kilometers":"{k} Kilometer","Test · {d}":"Test · {d}","Test run. Start with 5 minutes of easy jogging.":"Testlauf. Starte mit 5 Minuten lockerem Joggen.","Test run. Start with 10 minutes of easy running.":"Testlauf. Starte mit 10 Minuten lockerem Laufen.","{d} as fast as you can":"{d} so schnell du kannst","Now run {d} at race effort. Start a little slower than you think and finish strong. Go!":"Jetzt lauf {d} im Wettkampftempo. Starte etwas langsamer, als du denkst, und lauf stark ins Ziel. Los!","Now run {d} as fast as you can hold it evenly. Go!":"Jetzt lauf {d} so schnell, wie du es gleichmäßig halten kannst. Los!","Done! What a run. Walk or jog easy for 5 minutes.":"Geschafft! Was für ein Lauf. Geh oder jogge 5 Minuten locker aus.","Treat it like a race: start easy, drink if you need to, and keep an even pace. Your time shows how much you improved and sets your new paces.":"Lauf es wie einen Wettkampf: ruhig starten, bei Bedarf trinken und das Tempo gleichmäßig halten. Deine Zeit zeigt, wie viel du dich verbessert hast, und legt deine neuen Tempos fest.","Pick a flat route and run at an even, hard effort, with nothing left at the end. Your time shows how much you improved and sets your new paces.":"Wähle eine flache Strecke und lauf gleichmäßig hart, bis nichts mehr übrig ist. Deine Zeit zeigt, wie viel du dich verbessert hast, und legt deine neuen Tempos fest.","Show how far you've come":"Zeig, wie weit du gekommen bist","Choose your test":"Wähle deinen Test","Run any distance as fast as you can. The app compares it with your level before the plan, then sets your new paces.":"Lauf eine Distanz deiner Wahl so schnell du kannst. Die App vergleicht sie mit deinem Level vor dem Plan und legt dann deine neuen Tempos fest.","Run any distance as fast as you can. Your time sets all your paces. 3 km is the quickest way.":"Lauf eine Distanz deiner Wahl so schnell du kannst. Deine Zeit legt alle Tempos fest. 3 km geht am schnellsten.","About {t} at your current level":"Etwa {t} auf deinem aktuellen Level","Short and hard":"Kurz und hart","A solid all-round test":"Ein guter Allround-Test","A real race: plan a rest day after":"Ein echter Wettkampf: plane danach einen Ruhetag ein","{s} faster than before the plan":"{s} schneller als vor dem Plan","About the same as before the plan. Test days vary with sleep, weather and legs, so don't read too much into one run.":"Etwa wie vor dem Plan. Testtage hängen von Schlaf, Wetter und Beinen ab, also nimm einen einzelnen Lauf nicht zu ernst.","Before the plan your level predicted {t} for this distance.":"Vor dem Plan hat dein Level {t} für diese Distanz vorhergesagt.","The test distance wasn't completed, so your level stayed the same.":"Die Testdistanz wurde nicht ganz gelaufen, deshalb bleibt dein Level gleich.","Alternate legs: lunge, elbow down to the instep, rotate the arm up, step back and switch. Keep it flowing.":"Beine abwechseln: Ausfallschritt, Ellbogen zum Fußrist, Arm nach oben aufdrehen, zurücktreten und wechseln. Im Fluss bleiben.","About {n} reps, at your own pace":"Etwa {n} Wiederholungen, in deinem Tempo","About {n} reps.":"Etwa {n} Wiederholungen.","Pre-run mobility (standing)":"Mobility vor dem Laufen (im Stehen)","Post-run core (standing)":"Core nach dem Laufen (im Stehen)","Stretch & mobility (standing)":"Dehnen & Mobility (im Stehen)","Nothing. A wall, tree or post for balance helps.":"Nichts. Eine Wand, ein Baum oder Pfosten zum Festhalten hilft.","Nothing. A wall, bench or tree for the incline plank.":"Nichts. Eine Wand, Bank oder ein Baum für den schrägen Stütz.","Nothing. A wall, tree or bench helps.":"Nichts. Eine Wand, ein Baum oder eine Bank hilft.","Standing ankle rocks":"Sprunggelenk-Mobilisation im Stehen","Lunge with rotation":"Ausfallschritt mit Rotation","Standing glute kickbacks":"Bein nach hinten im Stand","Standing knee-to-elbow crunch":"Knie zum Ellbogen im Stehen","Incline plank":"Schräger Stütz","Standing side crunch":"Seitlicher Crunch im Stehen","Wood chops":"Holzhacker","Standing bird dog":"Bird Dog im Stehen","Slow marching":"Langsames Marschieren","Single-leg balance reach":"Einbeinstand mit Fußtippen","Standing hamstring stretch":"Beinrückseite dehnen im Stehen","Standing hip flexor stretch":"Hüftbeuger-Dehnung im Stehen","Standing figure-4":"Viererposition im Stehen","Standing adductor stretch":"Adduktoren-Dehnung im Stehen","Standing side bend":"Seitbeuge im Stehen","Chest opener":"Brust öffnen","Outside or wet ground?":"Draußen oder nasser Boden?","On the floor":"Am Boden","Standing only":"Nur im Stehen","Foot forward, push the knee over your toes, heel stays down. Hold a wall or tree.":"Fuß nach vorn, Knie über die Zehen schieben, Ferse bleibt unten. An Wand oder Baum festhalten.","Alternate legs: step into a lunge, rotate your chest over the front leg, step back and switch.":"Beine abwechseln: Ausfallschritt, Oberkörper über das vordere Bein drehen, zurücktreten und wechseln.","Stand on one leg, kick the other leg straight back and squeeze the glute. Don't lean forward.":"Auf einem Bein stehen, das andere Bein gestreckt nach hinten führen und den Po anspannen. Nicht nach vorn lehnen.","Hands behind your head, drive one knee up to the opposite elbow, alternate.":"Hände hinter dem Kopf, ein Knie zum gegenüberliegenden Ellbogen ziehen, abwechseln.","Hands on a wall, bench or tree, body in one straight line, squeeze your glutes.":"Hände an Wand, Bank oder Baum, Körper in einer Linie, Po anspannen.","Hand behind your head, lift the knee out to the side and crunch your elbow down to it.":"Hand hinter dem Kopf, Knie seitlich anheben und den Ellbogen zum Knie ziehen.","Hands together, sweep from high over one shoulder down across to the opposite hip. Turn through your hips.":"Hände zusammen, von schräg oben über einer Schulter diagonal zur anderen Hüfte ziehen. Aus der Hüfte drehen.","Stand on one leg, reach the opposite arm forward and the free leg back. Hold, then pull in.":"Auf einem Bein stehen, gegenüberliegenden Arm nach vorn und freies Bein nach hinten strecken. Halten, dann heranziehen.","Stand tall, brace your belly, lift each knee to hip height slowly. No leaning.":"Aufrecht stehen, Bauch fest, Knie langsam bis Hüfthöhe heben. Nicht lehnen.","Stand on one leg and tap the free foot forward, to the side and back.":"Auf einem Bein stehen und mit dem freien Fuß vorn, seitlich und hinten antippen.","Hands on a wall or tree, back heel down, knee straight.":"Hände an Wand oder Baum, hintere Ferse unten, Knie gestreckt.","Heel on a low step or bench, leg straight, hinge forward with a long back.":"Ferse auf eine niedrige Stufe oder Bank, Bein gestreckt, mit langem Rücken nach vorn beugen.","Long split stance, back knee off the ground. Tuck your pelvis and push your hips forward.":"Langer Schrittstand, hinteres Knie in der Luft. Becken einrollen und Hüfte nach vorn schieben.","Hold a wall or tree, ankle over the other knee, sit back like into a chair.":"An Wand oder Baum festhalten, Knöchel über das andere Knie, nach hinten setzen wie auf einen Stuhl.","Wide stance, bend one knee and shift over it, other leg straight.":"Weiter Stand, ein Knie beugen und das Gewicht darüber schieben, anderes Bein gestreckt.","Reach one arm overhead and lean to the other side.":"Einen Arm über den Kopf strecken und zur anderen Seite neigen.","Clasp your hands behind your back, lift your chest and gently raise your arms.":"Hände hinter dem Rücken verschränken, Brust heben und die Arme sanft anheben.","Put one heel on a low step, curb or bench, leg straight, toes up.":"Eine Ferse auf eine niedrige Stufe, Bordsteinkante oder Bank, Bein gestreckt, Zehen hoch.","Hinge forward from your hips with a long back, hands on your thighs.":"Mit langem Rücken aus der Hüfte nach vorn beugen, Hände auf den Oberschenkeln.","Feel the back of the thigh. Don't round your back to reach further.":"Du spürst die Oberschenkelrückseite. Nicht rund machen, um weiter zu kommen.","Take a
