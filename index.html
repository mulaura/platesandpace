<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate & Pace Run</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column, bottom tab bar, full-screen run display built for glancing mid-stride. Red = running, pace band colours = feedback. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#121721; --muted:#5A6474; --line:#D5DBE3;
  --red:#CF372B; --red-soft:#FBE5E2; --on-red:#FFFFFF;
  --ok:#1B8350; --ok-soft:#DDF2E6; --slow:#A66B12; --slow-soft:#FBEFD9; --fast:#1D4ED6; --fast-soft:#E2E9FB;
  --blue:#1D4ED6; --blue-soft:#E2E9FB; --on-blue:#FFFFFF; --yellow:#E2AE00; --green:#1C9655; --pwhite:#F6F6F1; --pblack:#2B2F36; --psilver:#AEB4BD;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1116; --surface:#171B22; --sunk:#202633; --ink:#E8ECF2; --muted:#98A2B2; --line:#2B323E;
  --red:#F2685C; --red-soft:#3A1F1D; --on-red:#1A0806;
  --ok:#4CC284; --ok-soft:#173326; --slow:#E3A94C; --slow-soft:#3A2D16; --fast:#7194FF; --fast-soft:#1C2741;
  --blue:#7194FF; --blue-soft:#1C2741; --on-blue:#0A1020; --pwhite:#E9E9E3; --pblack:#4A505A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
img,svg{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.3rem;font-weight:700;line-height:1}
h2{font-size:1.4rem;font-weight:600;line-height:1.1}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{border-color:var(--red);border-width:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-family:var(--display);font-size:1.4rem;letter-spacing:.04em;text-transform:uppercase}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.875rem}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.slow{background:var(--slow-soft);color:var(--slow)} .chip.fast{background:var(--fast-soft);color:var(--fast)}
.chip.sel{background:var(--ink);color:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* Segments */
.segs{display:flex;flex-direction:column}
.seg{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.seg:first-child{border-top:0}
.seg i{width:10px;align-self:stretch;border-radius:3px;background:var(--sunk)}
.seg.work i{background:var(--red)} .seg.steady i{background:var(--muted)}
.seg .v{font-family:var(--display);font-weight:600;font-size:1.05rem;text-align:right;white-space:nowrap}

/* Week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk .d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:.75rem;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.wk .d b{font-family:var(--display);font-size:1.2rem;line-height:1}
.wk .d.today{border-color:var(--ink);border-width:2px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.plan{border-color:var(--red)} .dot.done{background:var(--red);border-color:var(--red)} .dot.skip{background:var(--line);border-color:var(--line)}

/* Plan list */
.week{display:flex;flex-direction:column;gap:6px}
.week h3 .muted{font-family:var(--body);font-size:.85rem;font-weight:400}
.sess{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%}
.sess .dd{font-family:var(--display);font-weight:600;line-height:1.05}
.sess .dd small{display:block;color:var(--muted);font-size:.8rem;font-family:var(--body);font-weight:600}
.sess.done{opacity:.7} .sess.skipped .tt{text-decoration:line-through;color:var(--muted)}
.sess.today{border-color:var(--red);border-width:2px}
.tt{font-weight:600;min-width:0}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{padding:12px 2px 13px;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;border-top:3px solid transparent}
.tabs a[data-v="gym"][aria-current="page"]{border-top-color:var(--blue)}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}

/* Sheet & modal */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.foot .in>.btn{flex:1}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}

/* Run screen */
.run{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;user-select:none;-webkit-user-select:none}
.run .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-weight:600}
.gps{display:inline-flex;gap:6px;align-items:center}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--slow)}
.gps.good i{background:var(--ok)} .gps.bad i{background:var(--red)}
.segnow{border-radius:var(--r);padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.segnow.work{background:var(--red);border-color:var(--red);color:var(--on-red)}
.segnow.work .muted,.segnow.work .next{color:inherit;opacity:.9}
.segnow .lab{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.05}
.segnow .rem{font-family:var(--display);font-size:3.6rem;font-weight:700;line-height:1}
.prog{height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.prog>b{display:block;height:100%;background:currentColor}
.pacebox{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.pacebox.ok{background:var(--ok-soft);color:var(--ok)} .pacebox.slow{background:var(--slow-soft);color:var(--slow)} .pacebox.fast{background:var(--fast-soft);color:var(--fast)}
.pacebox .big{font-family:var(--display);font-size:clamp(4rem,22vw,6.5rem);font-weight:700;line-height:.9}
.pacebox .hint{font-weight:700;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stats b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.05}
.stats span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.run .ctrl{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);opacity:.35}
.next{font-size:.95rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
.route{width:100%;height:auto;background:var(--sunk);border-radius:8px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}
.rpe button.on{background:var(--red);color:var(--on-red);border-color:var(--red)}
.note{border-left:3px solid var(--red);padding-left:10px}
/* Day strip, gym, player */
.wkbar{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;align-items:center}
.wkbar .nav{min-height:36px;padding:0;border-radius:8px}
.wk button.d{cursor:pointer;font:inherit;color:inherit}
.wk .d.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk .d.sel .muted{color:inherit;opacity:.8}
.dot.gym{border-color:var(--blue)} .dot.gym.done{background:var(--blue)}
.dot.rec{border-color:var(--muted)} .dot.rec.done{background:var(--muted)}
.wk .d.sel .dot.done{border-color:var(--bg)}
.hero.gymc{border-color:var(--blue)}
.btn.blue{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip.lift{background:var(--blue-soft);color:var(--blue)} .chip.up{background:var(--blue);color:var(--on-blue)}
.chip.warn{color:var(--slow)} .chip.bad{color:var(--red)} .chip.good{color:var(--ok)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.ex:first-child{border-top:0}
.ex .nm{font-weight:600;min-width:0}
.ex .tg{font-family:var(--display);font-size:1.1rem;font-weight:600;text-align:right;white-space:nowrap}
.ex .sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spark{width:90px;height:28px;flex:none}
.plates{display:flex;align-items:center;gap:2px;height:30px;flex-wrap:nowrap}
.plates .barend{width:16px;height:6px;background:var(--psilver);border-radius:1px}
.pl{width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.p25{background:#CF372B;height:30px}.p20{background:#1D4ED6;height:30px}.p15{background:var(--yellow);height:27px}
.p10{background:var(--green);height:24px}.p5{background:var(--pwhite);height:19px;border-color:var(--muted)}
.p2{background:var(--pblack);height:15px;width:7px}.p1{background:var(--psilver);height:12px;width:6px}
.platecap{font-size:.75rem;color:var(--muted);margin-left:8px}
.setrow{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.setrow .sn{font-family:var(--display);font-weight:600;color:var(--muted)}
.setbtn{width:48px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.setbtn.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.wt{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.wt input{text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:600}
.ramp{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 10px}
.resttimer{display:flex;align-items:center;gap:8px;flex:1;font-family:var(--display);font-size:1.25rem;font-weight:600;min-width:0}
.verdict{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.verdict:first-child{border-top:0}
.edrow{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.edrow:first-child{border-top:0;padding-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.player{position:fixed;inset:0;z-index:75;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ring{width:min(62vw,250px);aspect-ratio:1;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .cnt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:4.2rem;font-weight:700}
.player .pname{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.05;max-width:20ch}
.player .cue{max-width:34ch;color:var(--muted)}

/* v4: coach, overview lists, plan picker */
.olist{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;counter-reset:s}
.olist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);counter-increment:s}
.olist li:first-child{border-top:0}
.olist li::before{content:counter(s);font-family:var(--display);color:var(--muted);min-width:22px}
.olist li>span:first-of-type{flex:1;min-width:0}
.olist li.cur{font-weight:700;color:var(--ink)} .olist li.cur::before{color:var(--red)} .olist li.past{opacity:.5}
.equip{margin:0} .equip strong{font-weight:600}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.stepper .btn{min-height:56px;font-size:1.5rem}
.stepper .val{text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.coach h1{font-size:2.1rem}
.prog2{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog2>b{display:block;height:100%;background:var(--blue)}
.restbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:var(--r);background:var(--blue-soft);color:var(--blue)}
.restbox .big{font-family:var(--display);font-size:5rem;font-weight:700;line-height:1}
.ptop{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick .btn{padding:0;min-height:44px;font-size:.85rem}
.daypick .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progpick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;width:100%}
.progpick:disabled{opacity:.55;cursor:default}
.planrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0 8px 10px;border-top:1px solid var(--line)}
.itemc h2{font-size:1.5rem}


.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.card summary{cursor:pointer;list-style:revert}
.actions{display:flex;flex-wrap:wrap;gap:8px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="tabs" id="tabs"><nav aria-label="Sections"></nav></div>
<div id="sheet" class="sheet" hidden></div>
<div id="foot" class="foot" hidden></div>
<div id="run" class="run" hidden></div>
<div id="player" class="player" hidden></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
"use strict";
/* ============================== clock (sim-aware) ============================== */
const QS = new URLSearchParams(location.search);
const SIM = Number(QS.get("sim")) || 0;          // ?sim=10 → simulated GPS at 10× speed
const T0 = Date.now();
const now = () => SIM ? T0 + (Date.now()-T0)*SIM : Date.now();

/* ================================ helpers ================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); }
const todayISO = () => iso(new Date(now()));
function niceDate(s, long){ return parseISO(s).toLocaleDateString(isDE()?"de-DE":"en-GB", long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"}); }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; }
function fmtPace(spk){ if(!spk || !isFinite(spk) || spk>1800) return "–:––"; spk=Math.round(spk); return `${Math.floor(spk/60)}:${String(spk%60).padStart(2,"0")}`; }
function sayPace(spk){ spk=Math.round(spk); const m=Math.floor(spk/60), s=spk%60; if(isDE()) return `${m} ${String(s).padStart(2,"0")}`; return s===0 ? `${m} flat` : `${m} ${s<10?"oh "+s:s}`; }
function sayDur(sec){ sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; if(!m) return `${s} seconds`; return s ? `${m} ${m===1?"minute":"minutes"} ${s}` : `${m} ${m===1?"minute":"minutes"}`; }
function fmtKm(m){ return (m/1000).toFixed(m<10000?2:1); }
function parseHMS(s){ const p=String(s||"").trim().split(":").map(Number); if(!p.length||p.some(isNaN)) return 0; return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60; }
function hav(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r; const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }

/* ================================ storage ================================ */
const DB = {
  db:null,
  open(){ return new Promise((res)=>{ try{ const r=indexedDB.open("pp-run",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); r.result.createObjectStore("runs",{keyPath:"id"}); };
    r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false); }catch(e){ res(false); } }); },
  _t(store, mode, fn){ return new Promise((res,rej)=>{ if(!this.db) return res(null); const tx=this.db.transaction(store,mode); const st=tx.objectStore(store); const q=fn(st); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }); },
  get(k){ return this._t("kv","readonly",s=>s.get(k)); },
  set(k,v){ return this._t("kv","readwrite",s=>s.put(v,k)); },
  del(k){ return this._t("kv","readwrite",s=>s.delete(k)); },
  runs(){ return this._t("runs","readonly",s=>s.getAll()); },
  putRun(r){ return this._t("runs","readwrite",s=>s.put(r)); },
  delRun(id){ return this._t("runs","readwrite",s=>s.delete(id)); }
};

/* ================================ state ================================ */
const clone = o => JSON.parse(JSON.stringify(o));
const DEFAULTS = { voice:true, voiceURI:"", paceAlerts:true, splits:true, programs:[], lang:"en" };
const S = { view:"today", settings:clone(DEFAULTS), over:{moves:{}, skips:{}, days:{}}, runs:[], lifts:[], recs:[], items:[], strState:{}, sel:null, weekOff:0 };
/* ================================ language ================================ */
// English is written in the code; German comes from the DE dictionary. Everything that reaches the screen
// or the voice passes through tr(): exact match, then a number pattern (# = any number), then its parts.
const isDE = () => S.settings && S.settings.lang==="de";
function tx(s, v){ let r = isDE() && DE[s] ? DE[s] : s; if(v) r=r.replace(/\{(\w+)\}/g,(_,k)=>v[k]??""); return r; }
const NUMRE=/\d+(?:[:.,]\d+)*/g;
function lookupDE(c){
  if(DE[c]) return DE[c];
  const nums=c.match(NUMRE);
  if(nums){ const key=c.replace(NUMRE,"#"); if(DE[key]){ let i=0; return DE[key].replace(/#/g,()=>nums[i++]); } }
  return null;
}
const HEADTAIL=/^(.*?[^\d\s(×–+-]) ((?:×|\(|\d|each side|per leg|per side|left\b|right\b).*)$/;
function trCore(c){
  if(!c) return c;
  let r=lookupDE(c); if(r!=null) return r;
  const m=c.match(/^(.*?)([.!?:)]+)$/);
  if(m && m[1]){ r=lookupDE(m[1]); if(r!=null) return r+m[2]; }
  const sents=c.split(/(?<=[a-zäöüß)]{2}[.!?])\s+(?=[A-ZÄÖÜ0-9])/);
  if(sents.length>1) return sents.map(trCore).join(" ");
  const pm=c.match(/^(\+ )(.+)$/); if(pm) return pm[1]+trCore(pm[2]);
  if(c.includes(" · ")){ const parts=c.split(" · "), out=parts.map(trCore); if(out.some((x,i)=>x!==parts[i])) return out.join(" · "); }
  const ci=c.indexOf(": "); if(ci>0){ const a=trCore(c.slice(0,ci)), b=trCore(c.slice(ci+2)); if(a!==c.slice(0,ci)||b!==c.slice(ci+2)) return a+": "+b; }
  for(const sep of [", ", " — "]){ if(c.includes(sep)){ const parts=c.split(sep), out=parts.map(trCore); if(out.some((x,i)=>x!==parts[i])) return out.join(sep); } }
  if(m && m[1]){ const x=trCore(m[1]); if(x!==m[1]) return x+m[2]; }
  const ht=c.match(HEADTAIL); if(ht){ const a=trCore(ht[1]), b=trCore(ht[2]); if(a!==ht[1]||b!==ht[2]) return a+" "+b; }
  return c;
}
function tr(text){
  if(!isDE() || !text) return text;
  const m=text.match(/^(\s*)([\s\S]*?)(\s*)$/); if(!m[2]) return text;
  return m[1]+trCore(m[2])+m[3];
}
function translateAttrs(el){ for(const a of ["placeholder","aria-label"]) if(el.hasAttribute(a)){ const v=el.getAttribute(a), r=tr(v); if(r!==v) el.setAttribute(a,r); } }
function translateNode(n){
  if(!isDE()) return;
  if(n.nodeType===3){ const v=n.nodeValue; if(/[A-Za-z]/.test(v)){ const r=tr(v); if(r!==v) n.nodeValue=r; } return; }
  if(n.nodeType!==1 || n.tagName==="SCRIPT" || n.tagName==="STYLE") return;
  translateAttrs(n);
  const w=document.createTreeWalker(n, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let x;
  while((x=w.nextNode())){ if(x.nodeType===3){ const v=x.nodeValue; if(/[A-Za-z]/.test(v)){ const r=tr(v); if(r!==v) x.nodeValue=r; } } else translateAttrs(x); }
}
new MutationObserver(ms=>{ if(!isDE()) return; for(const m of ms){ if(m.type==="characterData") translateNode(m.target); else m.addedNodes.forEach(translateNode); } })
  .observe(document.body,{childList:true,subtree:true,characterData:true});
async function saveSettings(){ await DB.set("settings2", S.settings); }
async function saveOver(){ await DB.set("over2", S.over); }
async function saveStr(){ await DB.set("strState", S.strState); }
function dowOf(d){ return (parseISO(d).getDay()+6)%7; }
function cdist(a,b){ const x=Math.abs(a-b); return Math.min(x,7-x); }
function combos(arr,k){ if(k===0) return [[]]; if(arr.length<k) return []; const [h,...t]=arr; return [...combos(t,k-1).map(c=>[h,...c]), ...combos(t,k)]; }
// choose k days that are as evenly spread across the week as possible
function pickSpread(days, k, fixed=[]){
  if(days.length<=k) return [...days];
  let best=null, bs=-1;
  for(const c of combos(days,k)){ const all=[...fixed,...c]; let mn=9, sum=0;
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){ const d=cdist(all[i],all[j]); mn=Math.min(mn,d); sum+=d; }
    const sc=mn*100+sum; if(sc>bs){ bs=sc; best=c; } }
  return best.sort((a,b)=>a-b);
}
function minLabel(sec){ return sec%60 ? (sec<120?`${sec} s`:`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} min`) : `${sec/60} min`; }

/* ============================== paces & runs ============================== */
/* Level = your 3 km time. Every pace is derived from it (Riegel's formula). */
const DEFAULT_3K = 1020;   // 17:00 until a level test or a chosen level says otherwise
function levelRef(P){ if(P && P.ref3k) return P.ref3k; const Q=S.settings.programs.find(p=>(p.key==="hm"||p.key==="k10")&&p.ref3k); return Q?Q.ref3k:DEFAULT_3K; }
function predict(t3, km){ return t3*Math.pow(km/3,1.06); }
function zones(P){
  const t3=levelRef(P), p5=predict(t3,5)/5, p10=predict(t3,10)/10, ph=predict(t3,21.0975)/21.0975, pt=(p10+ph)/2;
  return {
    easy:{name:tx("Easy"), lo:ph+55, hi:ph+85}, long:{name:tx("Long run"), lo:ph+40, hi:ph+70},
    hm:{name:tx("Half-marathon"), lo:ph-4, hi:ph+4}, thr:{name:tx("Threshold"), lo:pt-5, hi:pt+3},
    "10k":{name:"10K", lo:p10-4, hi:p10+4}, "5k":{name:"5K", lo:p5-4, hi:p5+4},
    stride:{name:tx("Stride"), lo:p5-30, hi:p5-15}, jog:{name:tx("Jog"), lo:ph+70, hi:ph+160}
  };
}
function levelLabel(t3){ return `3 km ${fmtDur(t3)} · 5K ${fmtDur(predict(t3,5))} · 10K ${fmtDur(predict(t3,10))} · ${tx("HM")} ${fmtDur(predict(t3,21.0975))}`; }
function testSession(retest){
  return {type:"test", title: retest?tx("Level re-test · 3 km"):tx("Level test · 3 km"), segs:[
    {kind:"warm", label:tx("Easy warm-up"), sec:600, zone:"easy", alerts:false, say:tx("Level test. Start with 10 minutes of easy running.")},
    {kind:"steady", label:tx("3 km as fast as you can"), m:3000, zone:"test", alerts:false, test:true, say:tx("Now run 3 kilometers as fast as you can hold it evenly. Go!")},
    {kind:"cool", label:tx("Cool-down"), sec:600, zone:"easy", alerts:false, say:tx("Done! Great effort. Jog easy for 10 minutes to cool down.")}],
    note:tx("Pick a flat route. Run the 3 km at an even, hard effort, with nothing left at the end. Your time sets all your paces.")};
}
const ZLABEL = () => ({"5k":tx("5K pace"),"10k":tx("10K pace"),thr:tx("threshold pace"),hm:tx("half-marathon pace"),stride:tx("stride pace")});
const WU = (min=15) => ({kind:"warm", label:"Warm-up", sec:min*60, zone:"easy", alerts:false, cue:"Easy jog, relax your shoulders, build into it."});
const CD = (min=10) => ({kind:"cool", label:"Cool-down", sec:min*60, zone:"easy", alerts:false, cue:"Bring it right down. Walk the last minute if you like."});
const STEADY = (min, zone, label) => ({kind:"steady", label, sec:Math.round(min*60), zone});
function REPS(n, sec, zone, rec){
  const out=[]; for(let i=1;i<=n;i++){ out.push({kind:"work", label:`Rep ${i} of ${n}`, rep:i, reps:n, zone, sec});
    if(i<n) out.push({kind:"rec", label:"Recovery jog", sec:rec, zone:"jog", alerts:false}); }
  return out;
}

function qualitySession(q){
  if(q.cont){ const z=q.z||"hm", nm=z==="hm"?tx("Half-marathon pace"):tx("Tempo run");
    return {type:"tempo", title:`${nm} · ${q.cont} min`, segs:[WU(15), STEADY(q.cont,z,`${q.cont} min ${tx("at")} ${ZLABEL()[z]}`), CD(10)], note:tx("Continuous and controlled: comfortably hard, never all-out.")}; }
  const [n,sec,z,rec]=q; const iv = z==="5k"||z==="10k";
  return {type:iv?"intervals":"tempo", title:`${iv?tx("Intervals"):z==="hm"?tx("Half-marathon pace"):tx("Threshold")} · ${n} × ${minLabel(sec)}`, segs:[WU(15), ...REPS(n,sec,z,rec), CD(10)],
    note: iv ? tx("Run the reps evenly. The last one should be as fast as the first, not faster.") : tx("Comfortably hard: you can say a few words, not whole sentences.")};
}
function longSession(L, Lhm, wk){
  if(Lhm) return {type:"long", title:`${tx("Long run")} · ${L} min`, segs:[STEADY(L-Lhm,"long",`${L-Lhm} min ${tx("easy")}`), STEADY(Lhm,"hm",tx("Last {n} min at half-marathon pace",{n:Lhm}))], note:tx("Relaxed, then finish the last {n} minutes at race pace.",{n:Lhm})};
  return {type:"long", title:`${tx("Long run")} · ${L} min`, segs:[STEADY(L,"long",`${L} min ${tx("at long-run pace")}`)], note: wk===12?tx("Short and easy. Race week."):tx("Conversational the whole way. Time on your feet is the point.")};
}
const easySession = min => ({type:"easy", title:`${tx("Easy run")} · ${min} min`, segs:[STEADY(min,"easy",`${min} min ${tx("easy")}`)], note:tx("Truly easy. If in doubt, slower.")});
const raceSession = key => key==="k10"
  ? {type:"race", title:tx("Race day · 10K"), segs:[{kind:"steady", label:"10 km", m:10000, zone:"10k"}], note:tx("Start controlled for the first 2 km, then build. Race it or run it as a time trial.")}
  : {type:"race", title:tx("Race day · Half marathon"), segs:[{kind:"steady", label:tx("Half marathon"), m:21097.5, zone:"hm"}], note:tx("Start a touch slower than goal pace for the first 2 km, settle in, and push from 18 km.")};
// which weekday gets which run, from the days the runner picked
function runRoles(days, plan){
  const ds=[...days].sort((a,b)=>a-b); const roles={}; if(!ds.length) return roles;
  if(plan==="start"){ pickSpread(ds, Math.min(3,ds.length)).forEach((d,i)=>roles[d]="b"+i); return roles; }
  const long = ds.includes(6)?6 : ds.includes(5)?5 : ds[ds.length-1];
  roles[long]="long";
  const rest=ds.filter(d=>d!==long), nq = ds.length>=4?2 : ds.length>=2?1 : 0;
  const q=pickSpread(rest, nq, [long]); q.forEach((d,i)=>roles[d]="q"+(i+1));
  let e=0; rest.filter(d=>!q.includes(d)).forEach(d=>roles[d]="e"+(e++));
  return roles;
}
const ROLE_NAME = {long:"Long run", q1:"Intervals", q2:"Threshold / race pace", e0:"Easy run", e1:"Easy run", e2:"Easy run", e3:"Easy run", b0:"Run/walk", b1:"Run/walk", b2:"Run/walk"};

/* Start running: 9 weeks of run/walk, 3 runs a week */
const BEG = [
  {pairs:Array(8).fill([60,90])}, {pairs:Array(6).fill([90,120])},
  {pairs:[[90,90],[180,180],[90,90],[180,180]]}, {pairs:[[180,90],[300,150],[180,90],[300,0]]},
  {byRun:[{pairs:[[300,180],[300,180],[300,0]]},{pairs:[[480,300],[480,0]]},{cont:1200}]},
  {byRun:[{pairs:[[300,180],[480,180],[300,0]]},{pairs:[[600,180],[600,0]]},{cont:1500}]},
  {cont:1500},{cont:1680},{cont:1800}
];
function rwSegs(pairs){
  const n=pairs.length, out=[{kind:"warm", label:"Brisk walk", sec:300, zone:"walk", alerts:false, say:"Warm-up. Brisk walk for 5 minutes. Swing your arms and loosen up."}];
  pairs.forEach(([r,w],i)=>{
    out.push({kind:"work", label:`Run ${i+1} of ${n}`, rep:i+1, reps:n, sec:r, zone:"beginner", alerts:false, quiet:true, rw:true, say:`Run ${i+1} of ${n}. ${sayDur(r)}, nice and easy. Go!`});
    if(w>0 && i<n-1) out.push({kind:"rec", label:"Walk", sec:w, zone:"walk", alerts:false, rw:true, say:`Walk. ${sayDur(w)}. ${n-i-1} ${n-i-1===1?"run":"runs"} to go.`});
  });
  out.push({kind:"cool", label:"Cool-down walk", sec:300, zone:"walk", alerts:false, say:"Done running! Walk for 5 minutes to cool down. Great job."});
  return out;
}
function contSegs(sec, last){
  return [{kind:"warm", label:"Brisk walk", sec:300, zone:"walk", alerts:false, say:"Warm-up. Brisk walk for 5 minutes."},
    {kind:"steady", label:`Run ${Math.round(sec/60)} minutes`, sec, zone:"beginner", alerts:false, rw:true, say:`Now run ${Math.round(sec/60)} minutes without stopping. Slower than you think. If you need to walk, walk, then start again.`},
    {kind:"cool", label:"Cool-down walk", sec:300, zone:"walk", alerts:false, say: last?"That's 30 minutes of running. You did it! Walk to cool down.":"Done! Walk for 5 minutes to cool down."}];
}
function begSession(wk, k){
  let W=BEG[wk-1]; if(W.byRun) W=W.byRun[k];
  if(W.cont){ const last = wk===9 && k===2; return {type:"runwalk", title: last?"Graduation run · 30 min":`Run ${Math.round(W.cont/60)} min nonstop`, segs:contSegs(W.cont,last), note: last?"Thirty minutes of running. Take it slow and enjoy it.":"Slow is fine. The goal is to keep moving, not speed."}; }
  const p=W.pairs, same=p.every(x=>x[0]===p[0][0]);
  return {type:"runwalk", title: same?`Run/walk · ${p.length} × ${minLabel(p[0][0])} running`:`Run/walk · ${p.map(x=>minLabel(x[0]).replace(" min","")).join(", ")} min running`, segs:rwSegs(p), note:"Run at a pace where you could still talk. The walking breaks are part of the plan."};
}
function buildRunItems(R){
  R.plan=R.key; if(!R.days.length || !R.start) return [];
  const roles=runRoles(R.days, R.plan), start=parseISO(R.start), nW = R.plan==="start"?9:12, out=[];
  let firstQ=true;
  for(let wk=1; wk<=nW; wk++){
    const week=[];
    for(let off=0; off<7; off++){
      const d=iso(addDays(start,(wk-1)*7+off)), role=roles[dowOf(d)]; if(!role) continue;
      let s;
      if(R.plan==="start") s=begSession(wk, +role.slice(1));
      else { let L,Lhm,E,Q1,Q2;
        if(R.plan==="hm") [L,Lhm,E,Q1,Q2]=HM[wk-1]; else { [L,E,Q1,Q2]=K10[wk-1]; Lhm=0; }
        const isQ = role==="q1" || role==="q2";
        if(isQ && wk===1 && firstQ && !R.ref3k){ s=testSession(false); firstQ=false; }
        else if(role==="q1" && (Q1==="test" || (R.plan==="hm" && wk===7))) s=testSession(true);
        else s = role==="long"?longSession(L,Lhm,wk) : role==="q1"?qualitySession(Q1) : role==="q2"?qualitySession(Q2) : easySession(Math.max(20,E-5*+role.slice(1)));
        if(isQ && wk===1) firstQ=false; }
      week.push({...s, id:`${R.id}-${wk}-${role}`, kind:"run", prog:R.id, pkey:R.key, role, date:d, wk, light:R.plan!=="start"&&LIGHT.has(wk)});
    }
    if(R.plan!=="start" && wk===12 && week.length){ const last=week[week.length-1]; Object.assign(last, raceSession(R.plan)); }
    out.push(...week);
  }
  return out;
}
function estSec(segs){ const Z=zones(); return segs.reduce((t,s)=>{ if(s.sec) return t+s.sec; const z=Z[s.zone]; return t+(s.m/1000)*(z?(z.lo+z.hi)/2:400); },0); }
function segValue(s){ const z=zones()[s.zone]; const pace = z && s.zone!=="jog" && s.alerts!==false ? ` · ${fmtPace(z.lo)}–${fmtPace(z.hi)} /km` : ""; return (s.m?`${(s.m/1000).toFixed(1)} km`:minLabel(s.sec))+pace; }
function rwPairs(segs){ const out=[]; segs.forEach((s,i)=>{ if(s.kind==="work"&&s.rw){ const n=segs[i+1]; out.push([s.sec, n&&n.kind==="rec"?n.sec:0]); } }); return out; }
function rwGroups(segs){ const g=[]; rwPairs(segs).forEach(([r,w])=>{ const L=g[g.length-1]; if(L&&L.r===r&&(L.w===w||w===0)) L.n++; else g.push({r,w,n:1}); }); return g; }
function segSummary(segs){
  if(segs.some(s=>s.rw)){ const st=segs.find(s=>s.kind==="steady"); return "5 min walk · " + (st ? `${Math.round(st.sec/60)} min running` : rwGroups(segs).map(g=>`${g.n>1?g.n+" × ":""}run ${minLabel(g.r)}${g.w?", walk "+minLabel(g.w):""}`).join(" · ")) + " · 5 min walk"; }
  const out=[]; let i=0;
  while(i<segs.length){ const s=segs[i], z=zones()[s.zone], pr = z&&s.zone!=="jog"&&s.alerts!==false ? ` at ${fmtPace(z.lo)}–${fmtPace(z.hi)}` : "";
    if(s.kind==="work" && s.rep===1){ const rec=segs[i+1]&&segs[i+1].kind==="rec"?segs[i+1]:null; out.push(`${s.reps} × ${minLabel(s.sec)}${pr}${rec?` (${minLabel(rec.sec)} jog)`:""}`); i+=s.reps*2-1; continue; }
    if(s.kind==="warm") out.push(`${Math.round(s.sec/60)} min warm-up`); else if(s.kind==="cool") out.push(`${Math.round(s.sec/60)} min cool-down`);
    else out.push(`${s.m?(s.m/1000).toFixed(1)+" km":minLabel(s.sec)}${pr}`);
    i++; }
  return out.join(" · ");
}
function segsHTML(segs){
  if(segs.some(s=>s.rw)){ const st=segs.find(s=>s.kind==="steady");
    const mid = st ? `<div class="seg work"><i></i><span>Run without stopping</span><span class="v num">${minLabel(st.sec)}</span></div>`
      : rwGroups(segs).map(g=>`<div class="seg work"><i></i><span>${g.n>1?g.n+" × ":""}run ${minLabel(g.r)}${g.w?`<br><span class="small muted">then walk ${minLabel(g.w)}</span>`:""}</span><span class="v num">${minLabel(g.r)}</span></div>`).join("");
    return `<div class="segs"><div class="seg"><i></i><span>Brisk walk warm-up</span><span class="v num">5 min</span></div>${mid}<div class="seg"><i></i><span>Cool-down walk</span><span class="v num">5 min</span></div></div>`; }
  const rows=[]; let i=0;
  while(i<segs.length){ const s=segs[i];
    if(s.kind==="work" && s.rep===1){ const n=s.reps; const rec=segs[i+1]&&segs[i+1].kind==="rec"?segs[i+1]:null; const z=zones()[s.zone];
      rows.push(`<div class="seg work"><i></i><span>${n} × ${minLabel(s.sec)} at ${ZLABEL()[s.zone]||"pace"}${rec?`<br><span class="small muted">${minLabel(rec.sec)} easy jog between</span>`:""}</span><span class="v num">${z?fmtPace(z.lo)+"–"+fmtPace(z.hi)+" /km":""}</span></div>`);
      i += n*2-1; continue; }
    rows.push(`<div class="seg ${s.kind==="steady"?"steady":""}"><i></i><span>${esc(s.label)}</span><span class="v num">${segValue(s)}</span></div>`); i++;
  }
  return `<div class="segs">${rows.join("")}</div>`;
}

/* ================================ voice ================================ */
let actx=null;
function audioOn(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(f=880,d=.15,delay=0){ try{ if(!actx) return; const t=actx.currentTime+delay; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.start(t); o.stop(t+d+.02);}catch(e){} }
function voice(){ if(!("speechSynthesis" in window)) return null; const vs=speechSynthesis.getVoices(); if(isDE()) return vs.find(v=>v.voiceURI===S.settings.voiceURI && /^de/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang)&&/enhanced|premium|anna|helena|markus/i.test(v.name)) || vs.find(v=>/^de/i.test(v.lang)) || null;
  return vs.find(v=>v.voiceURI===S.settings.voiceURI) || vs.find(v=>/en-(GB|US)/i.test(v.lang)&&/enhanced|premium|samantha|daniel/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
function say(text, urgent){
  if(isDE()) text = String(text).split(/(?<=[.!?])\s+/).map(tr).join(" "); if(window.__spoken) window.__spoken.push(text);
  if(R) R.log.push({t:elapsed(), text});
  if(!S.settings.voice || !("speechSynthesis" in window)) return;
  try{ if(urgent) speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const v=voice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang=isDE()?"de-DE":"en-GB"; u.rate=1.02; speechSynthesis.speak(u); }catch(e){}
}

/* ================================ GPS ================================ */
let watchId=null, lastFix=null, simState=null;
function startGPS(){
  if(watchId!==null) return;
  if(SIM){ simState={lat:47.3769, lon:8.5417, hdg:0, t:now()}; watchId=setInterval(simStep, 1000/Math.min(SIM,10)); return; }
  if(!("geolocation" in navigator)){ gpsState("bad","No GPS on this device"); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onGpsErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}
function stopGPS(){ if(watchId===null) return; if(SIM) clearInterval(watchId); else navigator.geolocation.clearWatch(watchId); watchId=null; }
function simStep(){
  const t=now(), dt=(t-simState.t)/1000; simState.t=t;
  let tgt=330; if(R && R.session){ const s=R.session.segs[R.segIdx]; const z=s&&zones()[s.zone]; if(z) tgt=(z.lo+z.hi)/2 + (s.kind==="work"?8:0); }
  const v=1000/tgt*(0.97+Math.random()*0.06); simState.hdg += (Math.random()-0.5)*0.15;
  const d=v*dt; simState.lat += d*Math.cos(simState.hdg)/111320; simState.lon += d*Math.sin(simState.hdg)/(111320*Math.cos(simState.lat*Math.PI/180));
  onPos({coords:{latitude:simState.lat+(Math.random()-.5)*2e-5, longitude:simState.lon+(Math.random()-.5)*2e-5, accuracy:5+Math.random()*6}, timestamp:t});
}
function onGpsErr(e){ gpsState("bad", e.code===1 ? "Location blocked" : "Searching for GPS…"); if(e.code===1) showLocationHelp(); }
function gpsState(cls, text){ const g=$("#gps"); if(g){ g.className="gps "+cls; g.querySelector("span").textContent=text; } }
function onPos(p){
  const acc=p.coords.accuracy;
  lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc, at:now()};
  gpsState(acc<=15?"good":acc<=35?"":"bad", `GPS ±${Math.round(acc)} m`);
  if(!R || R.pre || R.paused || R.ended) return;
  if(acc>40) return;
  const pt={t:elapsed(), lat:lastFix.lat, lon:lastFix.lon};
  if(!R.last){ R.last=pt; R.win.push({t:pt.t,d:R.dist}); return; }
  const d=hav(R.last,pt), dt=(pt.t-R.last.t)/1000;
  if(dt<=0) return;
  if(d/dt>9){ R.reject=(R.reject||0)+1; if(R.reject<5) return; }  // implausible jump; accept after repeated agreement
  R.reject=0;
  if(d<Math.max(2,acc*0.3) && dt<15) return;                       // standing-still jitter
  const prevD=R.dist, prevT=R.last.t;
  R.dist+=d; R.last=pt;
  R.win.push({t:pt.t,d:R.dist}); while(R.win.length>2 && pt.t-R.win[1].t>60000) R.win.shift();
  if(!R.pts.length || pt.t-R.pts[R.pts.length-1][2]>=4000) R.pts.push([+pt.lat.toFixed(5), +pt.lon.toFixed(5), Math.round(pt.t)]);
  // kilometre splits
  while(R.dist>=R.nextSplit){
    const tAt = prevT + (R.nextSplit-prevD)/(R.dist-prevD)*(pt.t-prevT);
    const sp = (tAt-R.lastSplitT)/1000; R.splits.push(sp); R.lastSplitT=tAt;
    const seg = R.session ? R.session.segs[R.segIdx] : null;
    if(S.settings.splits && (!seg || (seg.kind!=="work" && seg.kind!=="rec"))){
      say(`Kilometer ${R.splits.length}. Split ${sayPace(sp)}. Total ${sayDur(tAt/1000)}. Average pace ${sayPace(tAt/1000/(R.nextSplit/1000))}.`);
    }
    R.nextSplit+=1000;
  }
}
function curPace(){
  if(!R || R.win.length<2) return null;
  const last=R.win[R.win.length-1]; let first=null;
  for(const w of R.win){ if(last.t-w.t<=30000){ first=w; break; } }
  if(!first || first===last) first=R.win[Math.max(0,R.win.length-3)];
  const dd=last.d-first.d, dt=(last.t-first.t)/1000;
  if(dd<15 || dt<5) return null;
  // stale fix → no pace
  if(elapsed()-last.t>15000) return null;
  return dt/(dd/1000);
}

/* ============================== run engine ============================== */
let R=null, loop=null, wakeLock=null;
const elapsed = () => R ? R.acc + (R.paused||R.ended ? 0 : now()-R.resumedAt) : 0;

async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible"){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){ wakeLock=null; } }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && R && !R.ended) keepAwake(); if(document.visibilityState==="hidden" && R) persistActive(); });

function openPreRun(session){
  R=null; startGPS(); audioOn();
  const segs = session ? session.segs : null;
  const est = segs ? {sec:estSec(segs)} : null;
  $("#run").hidden=false; document.body.style.overflow="hidden";
  $("#run").innerHTML = `<div class="bar"><span class="gps" id="gps"><i></i><span>Searching for GPS…</span></span><button class="btn sm ghost" data-a="closePre">Cancel</button></div>
    <div class="stack"><div class="eyebrow">${session?niceDate(effDate(session),true):"Free run"}</div><h1>${esc(session?session.title:"Free run")}</h1>
    ${est?`<p class="muted num">About ${Math.round(est.sec/60)} min</p>`:`<p class="muted">Kilometre splits and pace, no targets.</p>`}</div>
    ${segs?`<div class="card" style="overflow:auto">${segsHTML(segs)}</div>`:""}
    <p class="small muted">Wait for the dot to turn green before starting. Keep the screen on and the app open; the phone can go in an armband or your hand.</p>
    <div class="ctrl" style="grid-template-columns:1fr"><button class="btn red big" data-a="go">Start</button></div>`;
  R = {pre:true, session: session ? {id:session.id, date:session.date, title:session.title, type:session.type, segs:session.segs} : null};
}
function goRun(){
  audioOn(); beep(660,.08);
  const sess = R && R.session;
  R = { id:uid(), session:sess, startWall:now(), acc:0, resumedAt:now(), paused:false, ended:false,
        dist:0, last:null, win:[], pts:[], splits:[], nextSplit:1000, lastSplitT:0,
        segIdx:0, segT0:0, segD0:0, results:[], lastCheck:0, okStreak:0, cues:{}, log:[] };
  if(lastFix && now()-lastFix.at<10000 && lastFix.acc<=40){ R.last={t:0,lat:lastFix.lat,lon:lastFix.lon}; R.win.push({t:0,d:0}); }
  drawRunScreen();
  if(sess){ announceSeg(0, true); } else say("Free run started. I'll call out every kilometer.");
  beep(1046,.3,.05);
  keepAwake();
  clearInterval(loop); loop=setInterval(tick, 250);
  persistActive();
}
function segRemaining(seg, segE, segD){ return seg.sec ? seg.sec*1000-segE : seg.m-segD; }
function zoneTxt(z){ return `${sayPace(z.lo)} to ${sayPace(z.hi)}`; }
function announceSeg(i, first){
  const seg=R.session.segs[i]; if(!seg) return;
  const Z=zones()[seg.zone];
  const len = seg.m ? (seg.m>=1000?`${+(seg.m/1000).toFixed(2)} kilometers`:`${seg.m} meters`) : sayDur(seg.sec);
  if(seg.say){ if(seg.kind==="work"){ beep(880,.12); beep(1318,.3,.18); } else beep(660,.15); say(seg.say, true); return; }
  let t;
  if(seg.kind==="work"){ t = `${seg.label}. ${len}${seg.zone==="stride"?" stride, fast and relaxed":` at ${zoneTxt(Z)} per kilometer`}. Go!`; beep(880,.12); beep(880,.12,.18); beep(1318,.35,.36); }
  else if(seg.kind==="rec") t = `Recovery. Jog ${len}.`;
  else if(seg.kind==="warm") t = `${first?"Let's go. ":""}Warm-up, ${len} easy. ${seg.cue||""}`;
  else if(seg.kind==="cool") t = `Cool-down, ${len}. ${seg.cue||""}`;
  else t = `${first?"Let's go. ":""}${seg.label}. Target ${zoneTxt(Z)} per kilometer.`;
  say(t, seg.kind==="work");
}
function finishSeg(seg, segE, segD, silent){
  if(seg.kind==="work" || seg.kind==="steady"){
    const res={label:seg.label, kind:seg.kind, zone:seg.zone, m:segD, sec:segE/1000, pace: segD>20 ? segE/1000/(segD/1000) : null};
    const z=zones()[seg.zone]; res.inZone = res.pace && z ? (res.pace>=z.lo-5 && res.pace<=z.hi+5) : null;
    R.results.push(res);
    if(!silent && seg.kind==="work" && !seg.quiet){
      const verdict = !res.pace||!z ? "" : res.pace>z.hi+5 ? " A bit slow." : res.pace<z.lo-5 ? " Faster than target, hold back next one." : " Right on target.";
      say(`${seg.rep===seg.reps?"Last rep":"Rep "+seg.rep} done. ${seg.m?sayDur(res.sec):(res.m>=1000?(res.m/1000).toFixed(2)+" kilometers":Math.round(res.m)+" meters")}. Pace ${res.pace?sayPace(res.pace):"unknown"}.${verdict}`, true);
    }
  }
}
function tick(){
  if(!R || R.ended || R.paused){ updateRunScreen(); return; }
  const e=elapsed();
  if(R.session){
    let guard=0;
    while(R.segIdx < R.session.segs.length && guard++<200){
      const seg=R.session.segs[R.segIdx], segE=e-R.segT0, segD=R.dist-R.segD0, rem=segRemaining(seg,segE,segD);
      const key=k=>R.cues[R.segIdx+":"+k];
      const mark=k=>R.cues[R.segIdx+":"+k]=1;
      if(rem>0){
        if(seg.sec){
          if(seg.rw && seg.sec>=480 && segE>=seg.sec*500 && !key("half")){ mark("half"); say("Halfway there. You've got this."); }
          if(seg.rw && seg.sec>=600 && rem<=120000 && rem>110000 && !key("2m")){ mark("2m"); say("Two minutes left."); }
          if(seg.sec>=90 && rem<=30000 && rem>25000 && !key("30")){ mark("30"); say(seg.kind==="rec"?"30 seconds. Get ready.":"30 seconds left."); }
          for(const s of [3,2,1]) if(rem<=s*1000 && !key("b"+s)){ mark("b"+s); beep(660,.1); }
        } else {
          if(seg.kind==="work" && seg.m>=400 && rem<=100 && !key("100")){ mark("100"); say("100 meters."); }
          if(seg.kind==="work" && seg.m>=1000 && segD>=seg.m/2 && !key("half")){ mark("half"); const p=segD>50?segE/1000/(segD/1000):null; say(`Halfway${p?". Pace "+sayPace(p):""}.`); }
          if(seg.kind==="steady" && seg.m>=3000 && rem<=1000 && !key("1k")){ mark("1k"); say(R.segIdx===R.session.segs.length-1?"One kilometer to go.":"One kilometer left in this block."); }
        }
        paceCheck(seg, segE);
        break;
      }
      // segment complete
      const behind = rem < -15000 || (seg.m && rem < -300);   // catching up after the phone was locked
      finishSeg(seg, seg.sec ? Math.min(segE, seg.sec*1000) : segE, segD, behind);
      R.segT0 = seg.sec ? R.segT0+seg.sec*1000 : e; R.segD0 = seg.m ? R.segD0+seg.m : R.dist;
      R.segIdx++; R.lastCheck=e; R.okStreak=0;
      if(R.segIdx>=R.session.segs.length){ say("Workout complete. Great job. Keep jogging if you like, then hold End to finish.", true); beep(1318,.2); beep(1568,.4,.22); break; }
      const nextSeg=R.session.segs[R.segIdx];
      const nextRem = segRemaining(nextSeg, e-R.segT0, R.dist-R.segD0);
      if(nextRem>0) announceSeg(R.segIdx);
    }
  }
  if(Math.floor(e/15000)!==R._p){ R._p=Math.floor(e/15000); persistActive(); }
  updateRunScreen();
}
function paceCheck(seg, segE){
  if(!S.settings.paceAlerts || seg.alerts===false) return;
  const z=zones()[seg.zone]; if(!z) return;
  const work = seg.kind==="work";
  const firstDelay = work ? (seg.sec && seg.sec<60 ? 1e9 : 25000) : 75000;
  const every = work ? 30000 : 120000;
  const e=elapsed();
  if(segE<firstDelay || e-R.lastCheck<every) return;
  const p=curPace(); if(!p) return;
  R.lastCheck=e;
  if(p>z.hi+5){ R.okStreak=0; say(`Pick it up. You're at ${sayPace(p)}. Target ${zoneTxt(z)}.`); }
  else if(p<z.lo-5){ R.okStreak=0; say(`Ease off. You're at ${sayPace(p)}. Target ${zoneTxt(z)}.`); }
  else { if(R.okStreak%3===0) say(`On pace. ${sayPace(p)}.`); R.okStreak++; }
}
function pauseRun(){ if(!R||R.paused) return; R.acc=elapsed(); R.paused=true; R.last=null; R.win=[]; say("Paused."); updateRunScreen(); persistActive(); }
function resumeRun(){ if(!R||!R.paused) return; R.resumedAt=now(); R.paused=false; if(lastFix&&now()-lastFix.at<10000){ R.last={t:elapsed(),lat:lastFix.lat,lon:lastFix.lon}; R.win=[{t:R.last.t,d:R.dist}]; } say("Resumed."); keepAwake(); updateRunScreen(); }
function endRun(){
  if(!R) return;
  R.acc=elapsed(); R.ended=true; clearInterval(loop); stopGPS();
  try{ wakeLock && wakeLock.release(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  if(R.session && R.segIdx < R.session.segs.length){ const seg=R.session.segs[R.segIdx]; finishSeg(seg, R.acc-R.segT0, R.dist-R.segD0, true); }
  const dur=R.acc/1000;
  const run = { id:R.id, date:iso(new Date(R.startWall)), startedAt:R.startWall, planId:R.session?R.session.id:null,
    title:R.session?R.session.title:"Free run", type:R.session?R.session.type:"free",
    m:Math.round(R.dist), sec:Math.round(dur), pace: R.dist>50 ? dur/(R.dist/1000) : null,
    splits:R.splits.map(s=>Math.round(s)), results:R.results, pts:R.pts, completed: R.session ? R.segIdx>=R.session.segs.length : true };
  R=null; DB.del("active");
  showSummary(run, true);
}
async function persistActive(){
  if(!R || R.pre || R.ended) return;
  const snap = {...R, acc:elapsed(), resumedAt:now(), savedAt:now()};
  try{ await DB.set("active", JSON.parse(JSON.stringify(snap))); }catch(e){}
}

/* ------------------------------ run screen ------------------------------ */
function drawRunScreen(){
  $("#run").hidden=false; document.body.style.overflow="hidden";
  $("#run").innerHTML = `<div class="bar"><span class="gps" id="gps"><i></i><span>${lastFix?`GPS ±${Math.round(lastFix.acc)} m`:"Searching for GPS…"}</span></span><span id="rTitle">${esc(R.session?R.session.title:"Free run")}</span></div>
    <div class="segnow" id="segnow"><div class="row between"><span class="lab" id="segLab"></span><span class="muted small num" id="segTgt"></span></div><div class="rem num" id="segRem"></div><div class="prog"><b id="segProg" style="width:0"></b></div><div class="next" id="segNext"></div></div>
    <div class="pacebox" id="pacebox"><span class="eyebrow" style="color:inherit">Current pace /km</span><span class="big num" id="paceNow">–:––</span><span class="hint" id="paceHint"></span></div>
    <div class="stats"><div><span>Distance</span><b class="num" id="sDist">0.00</b></div><div><span>Time</span><b class="num" id="sTime">0:00</b></div><div><span>Avg /km</span><b class="num" id="sAvg">–:––</b></div></div>

function updateRunScreen(){
  if(!R || R.pre || $("#run").hidden || !$("#sTime")) return;
  const e=elapsed();
  $("#sTime").textContent=fmtDur(e/1000);
  $("#sDist").textContent=fmtKm(R.dist);
  $("#sAvg").textContent=R.dist>50?fmtPace(e/1000/(R.dist/1000)):"–:––";
  const p=curPace(); $("#paceNow").textContent=fmtPace(p);
  const pb=$("#pacebox"); let cls="", hint="";
  const seg = R.session && R.session.segs[R.segIdx];
  if(seg){
    const z=zones()[seg.zone], segE=e-R.segT0, segD=R.dist-R.segD0, rem=Math.max(0,segRemaining(seg,segE,segD));
    $("#segnow").className="segnow"+(seg.kind==="work"?" work":"");
    $("#segLab").textContent=seg.label;
    $("#segTgt").textContent = z && seg.zone!=="jog" && seg.alerts!==false ? `${fmtPace(z.lo)}–${fmtPace(z.hi)} /km` : "";
    $("#segRem").textContent = seg.sec ? fmtDur(rem/1000) : (rem>=1000? (rem/1000).toFixed(2)+" km" : Math.round(rem)+" m");
    const tot = seg.sec?seg.sec*1000:seg.m; $("#segProg").style.width = Math.min(100,(1-rem/tot)*100)+"%";
    const n=R.session.segs[R.segIdx+1]; $("#segNext").textContent = n ? `Next: ${n.label}${n.kind==="work"?" · "+(n.m?amt(n.m):fmtDur(n.sec)):""}` : "Last block";
    if(p && z && seg.zone!=="jog" && seg.alerts!==false){ if(p>z.hi+5){cls="slow";hint="Speed up";} else if(p<z.lo-5){cls="fast";hint="Ease off";} else {cls="ok";hint="On target";} }
  } else if(R.session){
    $("#segnow").className="segnow"; $("#segLab").textContent="Workout complete"; $("#segTgt").textContent=""; $("#segRem").textContent="✓"; $("#segProg").style.width="100%"; $("#segNext").textContent="Hold End when you're done.";
  } else {
    $("#segnow").className="segnow"; $("#segLab").textContent="Free run"; $("#segTgt").textContent="";
    const into = R.dist-(R.nextSplit-1000); $("#segRem").textContent=`${Math.round(1000-into)} m`; $("#segProg").style.width=Math.min(100,into/10)+"%"; $("#segNext").textContent=`to kilometer ${R.nextSplit/1000}`;
  }
  if(R.paused){ cls=""; hint="Paused"; }
  pb.className="pacebox "+cls; $("#paceHint").textContent=hint;
  $("#pauseBtn").textContent=R.paused?"Resume":"Pause"; $("#pauseBtn").className="btn big"+(R.paused?" red":"");
}
function bindHold(){
  const b=$("#endBtn"), f=$("#endFill"); let t=null, st=0, raf=0;
  const up=()=>{ cancelAnimationFrame(raf); f.style.transform="scaleX(0)"; t=null; };
  const step=()=>{ const k=Math.min(1,(Date.now()-st)/1200); f.style.transform=`scaleX(${k})`; if(k>=1){ up(); endRun(); return; } raf=requestAnimationFrame(step); };
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); st=Date.now(); t=1; raf=requestAnimationFrame(step); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); endRun(); } });
}

/* ------------------------------ summary ------------------------------ */
function routeSVG(pts){
  if(!pts || pts.length<2) return "";
  const lat0=pts[0][0]*Math.PI/180; const xy=pts.map(p=>[p[1]*Math.cos(lat0), -p[0]]);
  const xs=xy.map(p=>p[0]), ys=xy.map(p=>p[1]); const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
  const W=560,H=300,pad=16, sc=Math.min((W-2*pad)/((mxx-mnx)||1e-9),(H-2*pad)/((mxy-mny)||1e-9));
  const ox=(W-(mxx-mnx)*sc)/2, oy=(H-(mxy-mny)*sc)/2;
  const P=xy.map(p=>[ox+(p[0]-mnx)*sc, oy+(p[1]-mny)*sc]);
  const d=P.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");
  return `<svg class="route" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route"><path d="${d}" fill="none" stroke="var(--red)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="var(--ok)"/><circle cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="6" fill="var(--ink)"/></svg>`;
}
function summaryBody(run){
  const work = (run.results||[]).filter(r=>r.kind==="work");
  const Z = zones();
  return `${routeSVG(run.pts)}
  <div class="stats"><div><span>Distance</span><b class="num">${fmtKm(run.m)}</b></div><div><span>Time</span><b class="num">${fmtDur(run.sec)}</b></div><div><span>Avg /km</span><b class="num">${fmtPace(run.pace)}</b></div></div>
  ${work.length?`<div class="card"><h3>Reps</h3><table><tr><th>Rep</th><th class="r">Dist</th><th class="r">Time</th><th class="r">Pace</th><th></th></tr>${work.map((r,i)=>{ const z=Z[r.zone]; const c=!r.pace||!z?"":r.pace>z.hi+5?"slow":r.pace<z.lo-5?"fast":"ok"; return `<tr><td>${i+1}</td><td class="r">${r.m>=1000?(r.m/1000).toFixed(2)+" km":Math.round(r.m)+" m"}</td><td class="r">${fmtDur(r.sec)}</td><td class="r">${fmtPace(r.pace)}</td><td class="r">${c?`<span class="chip ${c}">${c==="ok"?"On":c==="slow"?"Slow":"Fast"}</span>`:""}</td></tr>`; }).join("")}</table></div>`:""}
  ${(run.results||[]).filter(r=>r.kind==="steady").map(r=>{ const z=Z[r.zone]; return `<div class="card"><div class="row between"><h3>${esc(r.label)}</h3>${r.pace&&z?`<span class="chip ${r.pace>z.hi+5?"slow":r.pace<z.lo-5?"fast":"ok"}">${fmtPace(r.pace)} /km</span>`:""}</div><p class="small muted">Target ${z?fmtPace(z.lo)+"–"+fmtPace(z.hi):"–"} /km</p></div>`; }).join("")}
  ${run.splits&&run.splits.length?`<div class="card"><h3>Splits</h3><table><tr><th>Km</th><th class="r">Split</th></tr>${run.splits.map((s,i)=>`<tr><td>${i+1}</td><td class="r">${fmtPace(s)}</td></tr>`).join("")}</table></div>`:""}`;
}
function showSummary(run, fresh){
  $("#run").hidden=true; $("#run").innerHTML="";
  openSheet(`<div class="wrap"><div class="sheethead"><div><div class="eyebrow">${niceDate(run.date,true)}</div><h1>${esc(run.title)}</h1></div>${fresh?"":`<button class="btn ghost" data-a="close">Close</button>`}</div>

  </div>`, fresh ? `<button class="btn" data-a="discard">Discard</button><button class="btn red" data-a="saverun">Save run</button>` : null);
  S.pending = fresh ? run : null;
}

      const flat=[]; b.items.forEach(it=>(it.side?["left","right"]:[null]).forEach(side=>flat.push({n:it.n, cue:it.cue, note:it.note, side, reps:it.reps||null, s:it.reps?0:(it.s||wk), round:r+1, rounds:b.rounds>1?b.rounds:null, block:b.name})));

let play=null, playT=null, playWake=null;
async function startSteps(o){

function enterStep(){
  const s=play.steps[play.i];

  else if(s.noReady){ play.phase="go"; play.left=s.s; } else { play.phase="ready"; play.left=5; }

}

  const s=play.steps[play.i], n=tr(s.n), side=sideWord(s);
  if(s.rest) say(`${tx("Rest")}. ${restText(play.i)}.`);
  else if(s.reps) say(`${n}${side}. ${s.reps} ${tx("repetitions")}${s.note?", "+tr(s.note):""}. ${tx("Tap done when you're finished.")}`);
  else if(play.phase==="go"){ say(`${n}${side}. ${tx("Go!")}`); beep(1046,.25); }

}

function playTick(){
  if(!play || play.paused || play.phase==="reps") return;
  play.left--;
  if(play.left<=3 && play.left>0) beep(660,.08);
  if(play.left<=0){ if(play.phase==="ready"){ play.phase="go"; play.left=play.steps[play.i].s; beep(1046,.25); } else { advanceStep(); return; } }
  else if(play.phase==="go" && !play.steps[play.i].rest && play.left===Math.floor(play.steps[play.i].s/2) && play.steps[play.i].s>=40) say("Halfway.");

}

    ${where?`<div class="small muted">${esc(where)}</div>`:""}

    ${reps&&s.note?`<div class="chip">${esc(s.note)}</div>`:""}

let holdT=null;

    holdT=setInterval(()=>{ const sec=Math.floor((Date.now()-live.hold)/1000); const v=$("#cval"); if(v) v.textContent=sec; const ex=curEx(); if(sec===ex.repMin) beep(880,.12); if(sec===ex.repMax) beep(1318,.2); },250); }
  else { clearInterval(holdT); const sec=Math.floor((Date.now()-live.hold)/1000); live.hold=null; live.ex[live.cur.e].reps[live.cur.s]=sec; saveLive(); renderCoach(); }
}
function coachDone(){
  clearInterval(holdT); live.hold=null;

}

async function finishLift(){
  clearInterval(coachT); const w=LW(); const exLog=[], verdicts=[];
  w.exercises.forEach((ex,i)=>{ const L=live.ex[i]; const reps=L.reps.map(Number).filter((r,k)=>r>0 && (live.mode==="list"||L.done[k])); if(!reps.length) return;
    const logged={exId:ex.id, name:ex.name, weight:Number(L.weight)||0, reps}; const j=judge(ex,logged); logged.verdict=j.verdict;
    exLog.push(logged); verdicts.push({ex,logged,j}); S.strState[ex.id]={weight:j.next, fails:j.fails}; });
  if(!exLog.length){ toast("Log at least one set first."); return; }
  const sec=Math.round((Date.now()-live.started)/1000);
  const log={id:uid(), kind:"lift", planId:live.planId, date:todayISO(), startedAt:live.started, workoutId:live.wid, workoutName:w.name, exercises:exLog, sec};
  await DB.putRun(log); S.lifts.push(log); await saveStr();
  lsSet("pp.live2",null); live=null; say("Workout done. Great work.");
  openSheet(`<div class="wrap"><div><div class="eyebrow num">Done · ${fmtDur(sec)}</div><h1>Next time</h1></div>
    <div class="card">${verdicts.map(v=>`<div class="verdict"><strong>${esc(v.ex.name)}</strong><span class="chip ${VERDICT[v.j.verdict][1]}">${VERDICT[v.j.verdict][0]}</span><span class="small muted num" style="grid-column:1/-1">${v.logged.weight>0?fmtKg(v.logged.weight)+" kg × ":""}${v.logged.reps.join(", ")}. ${esc(v.j.note)}</span></div>`).join("")}</div>

  render();
}

/* ================================ items ================================ */
function buildItems(){
  S.items = S.settings.programs.flatMap(P => PROGRAMS[P.key].cat==="run" ? buildRunItems(P) : buildWorkoutItems(P))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.kind==="run"?-1:1));
}
const effDate = it => S.over.moves[it.id] || it.date;
const itemsOn = d => S.items.filter(it=>effDate(it)===d);
const itemById = id => S.items.find(it=>it.id===id);
function logFor(it){ return it.kind==="run" ? S.runs.find(r=>r.planId===it.id) : S.lifts.find(l=>l.planId===it.id); }
function daySkip(d){ return S.over.days[d]; }
function statusOf(it){ return logFor(it) ? "done" : (S.over.skips[it.id]!==undefined || daySkip(effDate(it))!==undefined) ? "skip" : "plan"; }
const catOf = it => it.kind==="run" ? "run" : it.cat;
const CATCOL = {run:"var(--red)", str:"var(--blue)", mob:"var(--ok)"};
const progOf = it => S.settings.programs.find(p=>p.id===it.prog);
const wo = it => getW(it.wid, (progOf(it)||{}).level);
const CATCOL_OTHER = "#8B5CF6";
function itemMin(it){ if(it.kind==="run") return Math.round(estSec(it.segs)/60); const w=wo(it); return woMinutes(w, null, w.warm); }
function itemSub(it){ if(it.kind==="run") return segSummary(it.segs); const w=wo(it); return w.type==="weights" ? w.exercises.map(e=>e.name).join(" · ") : w.blocks.map(b=>b.name).join(" · "); }
function progWeekNow(P){ const n=Math.floor((parseISO(todayISO())-parseISO(P.start))/(7*864e5))+1; return n; }

/* ================================ views ================================ */
function render(){

function statusChip(it){ const st=statusOf(it); return st==="done"?`<span class="chip ok">Done</span>`:st==="skip"?`<span class="chip">Skipped${S.over.skips[it.id]?" · "+esc(S.over.skips[it.id]):""}</span>`:""; }

      : `<button class="btn big block" style="background:${CATCOL[cat]};color:var(--on-blue);border-color:${CATCOL[cat]}" data-a="startwo" data-id="${it.id}">Start guided</button>`;

function viewPlan(){

function chartWeekly(){
  const m0=monday(parseISO(todayISO())), wk=[];
  for(let i=11;i>=0;i--){ const m=addDays(m0,-7*i), a=iso(m), b=iso(addDays(m,6)), inR=x=>x.date>=a&&x.date<=b;
    wk.push({m, run:S.runs.filter(inR).reduce((t,r)=>t+r.sec/60,0), str:S.lifts.filter(inR).reduce((t,r)=>t+(r.sec||1800)/60,0), rec:S.recs.filter(inR).reduce((t,r)=>t+r.sec/60,0), oth:S.others.filter(inR).reduce((t,r)=>t+r.min,0)}); }
  const tot=w=>w.run+w.str+w.rec+w.oth;
  const W=560,H=190,pl=34,pr=6,pt=12,pb=22, mx=Math.max(60,...wk.map(tot)), step=mx>300?120:mx>150?60:30, top=Math.ceil(mx/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top), bw=(W-pl-pr)/wk.length;
  let g=""; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const cols=[["run","var(--red)"],["str","var(--blue)"],["rec","var(--muted)"],["oth",CATCOL_OTHER]];
  const bars=wk.map((w,i)=>{ const x=pl+i*bw; let acc=0; const r=cols.map(([k,c])=>{ const v=w[k]; if(!v) return ""; const y0=y(acc), y1=y(acc+v); acc+=v; return `<rect x="${x+bw*.15}" y="${y1}" width="${bw*.7}" height="${Math.max(0,y0-y1)}" fill="${c}"/>`; }).join("");
    return r+(i%2===1||i===wk.length-1?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${w.m.getDate()}.${w.m.getMonth()+1}</text>`:""); }).join("");
  return `<div class="card"><h3>${tx("Training minutes per week")}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx("Training minutes per week")}">${g}${bars}</svg>
    <div class="row small">${[[tx("Running"),"var(--red)"],[tx("Strength & mobility"),"var(--blue)"],[tx("Routines"),"var(--muted)"],[tx("Other"),CATCOL_OTHER]].map(([l,c])=>`<span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></i>${l}</span>`).join("")}</div></div>`;
}
function chartEasy(){
  const pts=S.runs.filter(r=>(r.type==="easy"||r.type==="long")&&r.pace&&r.m>2000).sort((a,b)=>a.startedAt-b.startedAt).slice(-30);
  if(pts.length<2) return "";
  const W=560,H=170,pl=40,pr=10,pt=12,pb=20, ps=pts.map(r=>r.pace), lo=Math.floor((Math.min(...ps)-10)/15)*15, hi=Math.ceil((Math.max(...ps)+10)/15)*15;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1), y=v=>pt+(H-pt-pb)*((v-lo)/(hi-lo));
  let g=""; for(let v=lo; v<=hi; v+=15) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${fmtPace(v)}</text>`;
  return `<div class="card"><div class="row between"><h3>Easy & long run pace</h3><span class="small muted">higher = faster</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average pace on easy and long runs over time">${g}<path d="${pts.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(r.pace).toFixed(1)).join("")}" fill="none" stroke="var(--red)" stroke-width="2"/>${pts.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.pace)}" r="3" fill="var(--red)"/>`).join("")}</svg><p class="small muted">At the same easy effort, this line should creep upward over the weeks.</p></div>`;
}

  const grp=(cat,label)=>`<h3>${label}</h3>${Object.entries(PROGRAMS).filter(([,p])=>p.cat===cat).map(([k,p])=>`<button class="progpick" style="border-left:4px solid ${CATCOL[cat]}" data-a="pickplan" data-k="${k}" ${active.has(k)?"disabled":""}><span class="row between"><strong>${esc(p.name)}</strong><span class="chip">${active.has(k)?"Active":p.weeks+" weeks · "+p.need}</span></span><span class="small">${esc(p.desc)}</span><span class="small muted">Equipment: ${esc(p.equip)}</span></button>`).join("")}`;
  openSheet(`<div class="wrap"><div class="sheethead"><h1>Add a plan</h1><button class="btn ghost" data-a="close">Close</button></div>
    <p class="small muted">Pick as many as you like. Sessions from all your plans show up together on each day.</p>
    ${grp("run","Running")}${grp("str","Strength")}${grp("mob","Mobility")}</div>`);
}
function openPlanForm(key, id){
  const P=id?S.settings.programs.find(p=>p.id===id):null, def=PROGRAMS[key];
  const runDays=(S.settings.programs.find(p=>PROGRAMS[p.key].cat==="run")||{}).days;
  S.form = S.form && S.form.key===key && S.form.id===id ? S.form : {key, id, days:P?[...P.days]:[], start:P?P.start:todayISO(), ref3k:P?P.ref3k||null:(S.settings.programs.find(q=>q.ref3k)||{}).ref3k||null, level:P&&P.level!=null?P.level:1};
  const f=S.form, n=f.days.length;
  const preview = (()=>{ const tmp={id:"tmp",key,days:f.days,start:f.start,ref3k:f.ref3k,level:f.level}; const its=(def.cat==="run"?buildRunItems(tmp):buildWorkoutItems(tmp)).slice(0, def.cat==="run"?Math.max(1,n):Math.max(1,Math.min(n,def.n||n)));
    return its.length?`<div class="card"><h3>Your first week</h3>${its.map(it=>`<div class="row between" style="border-top:1px solid var(--line);padding-top:6px"><span>${niceDate(it.date)}</span><span class="small">${esc(it.title)}</span></div>`).join("")}</div>`:""; })();
  const hint = def.cat==="run" ? (key==="hm" ? (n<2?"Pick at least 2 days.":n<4?`With ${n} days you get a long run${n>=2?", one interval session":""}${n>=3?" and an easy run":""}. 4–5 days is ideal.`:`Long run on ${DOW[Object.entries(runRoles(f.days,"hm")).find(([,r])=>r==="long")[0]]}, two quality sessions, the rest easy.`) : (n<3?"3 days works best. With fewer you'll progress more slowly.":n>3?"Only 3 runs a week are used, spread across your days.":""))
    : (n<(def.n||1)?`This program has ${def.n} sessions a week; with ${n} day${n===1?"":"s"} some will be left out.`:n>(def.n||n)?`${def.n} sessions a week, spread across these days.`:"");
  openSheet(`<div class="wrap"><div class="sheethead"><div><div class="eyebrow">${id?"Edit plan":"New plan"}</div><h1>${esc(def.name)}</h1></div><button class="btn ghost" data-a="${id?"close":"addplan"}">${id?"Cancel":"Back"}</button></div>
    <p class="small">${esc(def.desc)}</p>
    <div class="card"><h3>Which days can you train?</h3><div class="daypick">${DOW.map((d,i)=>`<button class="btn ${f.days.includes(i)?"on":""}" data-a="fday" data-i="${i}" aria-pressed="${f.days.includes(i)}">${d}</button>`).join("")}</div>
      <p class="small muted">${hint}</p></div>
    ${key==="hm"||key==="k10"?`<div class="card"><h3>${tx("Your level")}</h3><label class="f">${tx("How fast can you run 3 km right now?")}<select id="fLevel"><option value="">${tx("I don't know yet: start with a level test")}</option>${Array.from({length:37},(_,i)=>600+i*30).map(x=>`<option value="${x}" ${f.ref3k===x?"selected":""}>${esc(levelLabel(x))}</option>`).join("")}</select></label>
      <p class="small muted">${f.ref3k?tx("All your paces are worked out from this. You can retest any time in Settings."):tx("Week 1 then starts with a level test: 10 minutes easy, 3 km as fast as you can, 10 minutes easy. Your time sets all your paces.")}</p></div>`
    : def.cat!=="run"?`<div class="card"><h3>${tx("Your level")}</h3><div class="row" style="gap:6px">${LEVELS.map((l,i)=>`<button class="btn sm ${f.level===i?"blue":""}" data-a="flevel" data-v="${i}">${tx(l)}</button>`).join("")}</div><p class="small muted">${tx(["Fewer sets and shorter holds and intervals.","The program as written.","An extra set per exercise, longer holds and intervals."][f.level])}</p></div>`:""}
    <div class="card"><h3>Start</h3><div class="row"><button class="btn sm ${f.start===todayISO()?"blue":""}" data-a="fstart" data-v="${todayISO()}">Today</button><button class="btn sm ${f.start===iso(monday(addDays(new Date(now()),7)))?"blue":""}" data-a="fstart" data-v="${iso(monday(addDays(new Date(now()),7)))}">Next Monday</button></div>
      <label class="f">Or pick a date<input type="date" id="fStart" value="${f.start}"></label></div>
    ${preview}
    ${id?`<button class="btn ghost" data-a="removeplan" data-id="${id}" style="color:var(--red)">Remove this plan</button>`:""}</div>`,
    `<button class="btn red big" data-a="saveplan" ${f.days.length?"":"disabled"}>${id?"Save changes":"Start this plan"}</button>`);
}
async function savePlanForm(){
  const f=S.form, def=PROGRAMS[f.key];
  if(f.key==="hm" && f.days.length<2){ toast("Pick at least 2 running days."); return; }
  const ps=S.settings.programs;
  const data={days:[...f.days].sort((a,b)=>a-b), start:f.start, ref3k:f.ref3k||null, level:f.level};
  if(f.id){ const P=ps.find(p=>p.id===f.id); Object.assign(P,data); } else ps.push({id:"p"+uid(), key:f.key, ...data});
  S.form=null; await saveSettings(); buildItems(); closeSheet(); S.sel=null; S.weekOff=0; location.hash="#today"; render(); toast(tx("{n} is set up.",{n:tr(def.name)})+" "+(f.start===todayISO()?tx("It starts today."):tx("It starts {d}.",{d:niceDate(f.start)})));
}

async function setLang(l){ S.settings.lang=l; await saveSettings(); buildItems(); closeSheet(); document.documentElement.lang=l; render(); }
function readForm(){ if(!S.form) return; const lv=$("#fLevel"), st=$("#fStart"); if(lv) S.form.ref3k=lv.value?+lv.value:null; if(st&&st.value) S.form.start=st.value; }

document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="fStart" && t.value){ readForm(); openPlanForm(S.form.key,S.form.id); }
  if(t.id==="fLevel"){ readForm(); openPlanForm(S.form.key,S.form.id); }
  if(t.id==="sLang"){ setLang(t.value); }
  if(t.id==="sVoice"){ S.settings.voice=t.checked; await saveSettings(); }
  if(t.id==="sAlerts"){ S.settings.paceAlerts=t.checked; await saveSettings(); }
  if(t.id==="sSplits"){ S.settings.splits=t.checked; await saveSettings(); }
  if(t.id==="sVoiceSel"){ S.settings.voiceURI=t.value; await saveSettings(); }
  if(t.id==="imp" && t.files[0]){ try{ const data=JSON.parse(await t.files[0].text()); if(data.app!=="plate-pace-run") throw 0;
      for(const r of data.runs||[]) await DB.putRun(r);
      if(data.v>=4){ S.settings={...clone(DEFAULTS),...data.settings}; S.over={moves:{},skips:{},days:{},...data.over}; S.strState=data.strState||{}; await saveSettings(); await saveOver(); await saveStr(); }
      await loadLogs(); buildItems(); render(); toast(`Imported ${(data.runs||[]).length} sessions.`);
    }catch(err){ toast("That file isn't a Pace backup."); } }
});

async function migrate(){
  // earlier versions: one half-marathon plan and one gym program
  const old=await DB.get("settings"), gym=await DB.get("gym"), st=clone(DEFAULTS);
  if(old){ ["voice","voiceURI","paceAlerts","splits"].forEach(k=>{ if(old[k]!==undefined) st[k]=old[k]; });
    const days=old.days?[...new Set(Object.values(old.days))].sort():PROGRAMS.hm.days; const [h,m]=String(old.targetHM||"2:00:00").split(":").map(Number);
    const hmSec=(h||2)*3600+(m||0)*60; st.programs.push({id:"p"+uid(), key:old.program==="start"?"start":"hm", days, start:todayISO(), ref3k:Math.round(hmSec*Math.pow(3/21.0975,1.06)), level:1}); }
  if(gym){ const g=gym.workouts?{active:"runner",programs:{runner:gym}}:gym;
    if(old) st.programs.push({id:"p"+uid(), key:g.active||"runner", days:[...PROGRAMS[g.active||"runner"].days], start:todayISO(), level:1});
    const ids=new Set(Object.values(WORKOUTS).flatMap(w=>(w.exercises||[]).map(e=>e.id)));
    Object.values(g.programs||{}).forEach(p=>(p.workouts||[]).forEach(w=>(w.exercises||[]).forEach(ex=>{ const nid={g2:"rdl",l2:"rdl",g3:"bss",l4:"bss",g6:"legcurl",l6:"legcurl"}[ex.id]||ex.id; if(ids.has(nid)) S.strState[nid]={weight:ex.weight, fails:ex.fails||0}; }))); }
  return st;
}
(async function boot(){
  await DB.open();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  S.strState = await DB.get("strState") || {};
  const st = await DB.get("settings2");
  S.settings = st ? {...clone(DEFAULTS), ...st} : await migrate();
  if(!st){ await saveSettings(); await saveStr(); }
  S.over = {moves:{}, skips:{}, days:{}, ...(await DB.get("over2")||{})};
  await loadLogs(); buildItems(); route();
  const act = await DB.get("active");
  if(act && now()-act.savedAt < 6*3600e3){
    S.activeSnap=act;
    openSheet(`<div class="wrap"><h1>Unfinished run</h1><p>A run from ${new Date(act.startWall).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} was interrupted at ${fmtKm(act.dist)} km, ${fmtDur(act.acc/1000)}.</p>
      <div class="stack"><button class="btn red block" data-a="resume">Continue it</button><button class="btn block" data-a="saveactive">Finish and save</button><button class="btn ghost block" data-a="dropactive">Discard</button></div></div>`);
  } else { const lv=lsGet("pp.live2"); if(lv && Date.now()-lv.started<6*3600e3 && WORKOUTS[lv.wid]){
    openSheet(`<div class="wrap"><h1>Unfinished workout</h1><p>${esc(WORKOUTS[lv.wid].name)} from ${new Date(lv.started).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} isn't finished yet.</p>
      <div class="stack"><button class="btn blue block" data-a="resumelift">Continue it</button><button class="btn ghost block" data-a="droplift">Discard</button></div></div>`); } }
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
