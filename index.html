 mit Eiweiß, etwa 20–40 g. Zum Beispiel Joghurt mit Nüssen, Eier, Tofu, Hähnchen, Linsen oder einen Proteinshake.","Spread your protein over the day. Some at every meal helps your muscles recover and grow.":"Verteile dein Eiweiß über den Tag. Ein bisschen zu jeder Mahlzeit hilft deinen Muskeln, sich zu erholen und zu wachsen.","Muscles get stronger while you rest, not while you lift. Aim for 7–9 hours of sleep.":"Muskeln werden in der Pause stärker, nicht beim Training. Ziel: 7–9 Stunden Schlaf.","Sore muscles after a new workout are normal and usually fade within 2–3 days. Gentle movement helps more than lying still.":"Muskelkater nach einem neuen Training ist normal und vergeht meist in 2–3 Tagen. Lockere Bewegung hilft mehr als Stillliegen.","After your run, refuel with carbs plus some protein. For example a banana and yogurt, rice with chicken or tofu, or a sandwich.":"Tank nach dem Lauf Kohlenhydrate und etwas Eiweiß auf. Zum Beispiel Banane und Joghurt, Reis mit Hähnchen oder Tofu oder ein Sandwich.","Drink after your run, especially when it's warm. Pale yellow urine is a good sign you've had enough.":"Trink nach dem Lauf, besonders wenn es warm ist. Hellgelber Urin zeigt, dass du genug getrunken hast.","Easy runs build your engine. If you can't chat in full sentences, slow down.":"Lockere Läufe bauen deine Ausdauer auf. Wenn du nicht in ganzen Sätzen reden kannst, lauf langsamer.","Long run done: have a proper meal with carbs and protein within an hour or two, and drink well.":"Langer Lauf geschafft: Iss innerhalb von ein, zwei Stunden eine richtige Mahlzeit mit Kohlenhydraten und Eiweiß und trink gut.","For runs longer than about 75–90 minutes, take some carbs along, like a gel, dates or a sports drink.":"Bei Läufen über etwa 75–90 Minuten nimm Kohlenhydrate mit, zum Beispiel ein Gel, Datteln oder ein Sportgetränk.","Hard days hard, easy days easy: keep your next run truly easy.":"Harte Tage hart, lockere Tage locker: Lauf deinen nächsten Lauf wirklich locke /* ================================ state ================================ */
const clone = o => JSON.parse(JSON.stringify(o));
const DEFAULTS = { voice:true, voiceURI:"", paceAlerts:true, splits:true, programs:[], lang:"en" };
const S = { view:"today", settings:clone(DEFAULTS), over:{moves:{}, skips:{}, days:{}}, runs:[], lifts:[], recs:[], items:[], strState:{}, sel:null, weekOff:0 };
/* ================================ language ================================ */
// English is written in the code; German comes from the DE dictionary. Everything that reaches the screen
// or the voice passes through tr(): exact match, then a number pattern (# = any number), then its parts.
const isDE = () => S.settings && S.settings.lang==="de";
function tx(s, v){ let r = isDE() && DE[s] ? DE[s] : s; if(v) r=r.replace(/\{(\w+)\}/g,(_,k)=>v[k]??""); return r; }
const NUMRE=/\d+(?:[:.,]\d+)*/g;
function lookupDE(c){
  if(DE[c]) return DE[c];
  const nums=c.match(NUMRE);
  if(nums){ const key=c.replace(NUMRE,"#"); if(DE[key]){ let i=0; return DE[key].replace(/#/g,()=>nums[i++]); } }
  return null;
}
const HEADTAIL=/^(.*?[^\d\s(×–+-]) ((?:×|\(|\d|each side|per leg|per side|left\b|right\b).*)$/;
function trCore(c){
  if(!c) return c;
  let r=lookupDE(c); if(r!=null) return r;
  const m=c.match(/^(.*?)([.!?:)]+)$/);
  if(m && m[1]){ r=lookupDE(m[1]); if(r!=null) return r+m[2]; }
  const sents=c.split(/(?<=[a-zäöüß)]{2}[.!?])\s+(?=[A-ZÄÖÜ0-9])/);
  if(sents.length>1) return sents.map(trCore).join(" ");
  const pm=c.match(/^(\+ )(.+)$/); if(pm) return pm[1]+trCore(pm[2]);
  if(c.includes(" · ")){ const parts=c.split(" · "), out=parts.map(trCore); if(out.some((x,i)=>x!==parts[i])) return out.join(" · "); }
  const ci=c.indexOf(": "); if(ci>0){ const a=trCore(c.slice(0,ci)), b=trCore(c.slice(ci+2)); if(a!==c.slice(0,ci)||b!==c.slice(ci+2)) return a+": "+b; }
  for(const sep of [", ", " — "]){ if(c.includes(sep)){ const parts=c.split(sep), out=parts.map(trCore); if(out.some((x,i)=>x!==parts[i])) return out.join(sep); } }
  if(m && m[1]){ const x=trCore(m[1]); if(x!==m[1]) return x+m[2]; }
  const ht=c.match(HEADTAIL); if(ht){ const a=trCore(ht[1]), b=trCore(ht[2]); if(a!==ht[1]||b!==ht[2]) return a+" "+b; }
  return c;
}
function tr(text){
  if(!isDE() || !text) return text;
  const m=text.match(/^(\s*)([\s\S]*?)(\s*)$/); if(!m[2]) return text;
  return m[1]+trCore(m[2])+m[3];
}
function translateAttrs(el){ for(const a of ["placeholder","aria-label"]) if(el.hasAttribute(a)){ const v=el.getAttribute(a), r=tr(v); if(r!==v) el.setAttribute(a,r); } }
function translateNode(n){
  if(!isDE()) return;
  if(n.nodeType===3){ const v=n.nodeValue; if(/[A-Za-z]/.test(v)){ const r=tr(v); if(r!==v) n.nodeValue=r; } return; }
  if(n.nodeType!==1 || n.tagName==="SCRIPT" || n.tagName==="STYLE") return;
  translateAttrs(n);
  const w=document.createTreeWalker(n, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let x;
  while((x=w.nextNode())){ if(x.nodeType===3){ const v=x.nodeValue; if(/[A-Za-z]/.test(v)){ const r=tr(v); if(r!==v) x.nodeValue=r; } } else translateAttrs(x); }
}
new MutationObserver(ms=>{ if(!isDE()) return; for(const m of ms){ if(m.type==="characterData") translateNode(m.target); else m.addedNodes.forEach(translateNode); } })
  .observe(document.body,{childList:true,subtree:true,characterData:true});
async function saveSettings(){ await DB.set("settings2", S.settings); }
async function saveOver(){ await DB.set("over2", S.over); }
async function saveStr(){ await DB.set("strState", S.strState); }
function dowOf(d){ return (parseISO(d).getDay()+6)%7; }
function cdist(a,b){ const x=Math.abs(a-b); return Math.min(x,7-x); }
function combos(arr,k){ if(k===0) return [[]]; if(arr.length<k) return []; const [h,...t]=arr; return [...combos(t,k-1).map(c=>[h,...c]), ...combos(t,k)]; }
// choose k days that are as evenly spread across the week as possible
function pickSpread(days, k, fixed=[]){
  if(days.length<=k) return [...days];
  let best=null, bs=-1;
  for(const c of combos(days,k)){ const all=[...fixed,...c]; let mn=9, sum=0;
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){ const d=cdist(all[i],all[j]); mn=Math.min(mn,d); sum+=d; }
    const sc=mn*100+sum; if(sc>bs){ bs=sc; best=c; } }
  return best.sort((a,b)=>a-b);
}
function minLabel(sec){ return sec%60 ? (sec<120?`${sec} s`:`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} min`) : `${sec/60} min`; }

/* ============================== paces & runs ============================== */
/* Level = your 3 km time. Every pace is derived from it (Riegel's formula). */
const DEFAULT_3K = 1020;   // 17:00 until a level test or a chosen level says otherwise
function levelRef(P){ if(P && P.ref3k) return P.ref3k; const Q=S.settings.programs.find(p=>(p.key==="hm"||p.key==="k10")&&p.ref3k); return Q?Q.ref3k:DEFAULT_3K; }
function predict(t3, km){ return t3*Math.pow(km/3,1.06); }
function zones(P){

      rows.push(`<div class="seg work"><i></i><span>${n} × ${minLabel(s.sec)} at ${ZLABEL()[s.zone]||"pace"}${rec?`<br><span class="small muted">${minLabel(rec.sec)} easy jog between</span>`:""}</span><span class="v num">${z?fmtPace(z.lo)+"–"+fmtPace(z.hi)+" /km":""}</span></div>`);
      i += n*2-1; continue; }
    rows.push(`<div class="seg ${s.kind==="steady"?"steady":""}"><i></i><span>${esc(s.label)}</span><span class="v num">${segValue(s)}</span></div>`); i++;

}

/* ================================ voice ================================ */
let actx=null;
function audioOn(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(f=880,d=.15,delay=0){ try{ if(!actx) return; const t=actx.currentTime+delay; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.start(t); o.stop(t+d+.02);}catch(e){} }
function voice(){ if(!("speechSynthesis" in window)) return null; const vs=speechSynthesis.getVoices(); if(isDE()) return vs.find(v=>v.voiceURI===S.settings.voiceURI && /^de/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang)&&/enhanced|premium|anna|helena|markus/i.test(v.name)) || vs.find(v=>/^de/i.test(v.lang)) || null;
  return vs.find(v=>v.voiceURI===S.settings.voiceURI) || vs.find(v=>/en-(GB|US)/i.test(v.lang)&&/enhanced|premium|samantha|daniel/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
function say(text, urgent){
  if(isDE()) text = String(text).split(/(?<=[.!?])\s+/).map(tr).join(" "); if(window.__spoken) window.__spoken.push(text);
  if(R && R.log) R.log.push({t:elapsed(), text});
  if(!S.settings.voice || !("speechSynthesis" in window)) return;
  try{ if(urgent) speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const v=voice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang=isDE()?"de-DE":"en-GB"; u.rate=1.02; speechSynthesis.speak(u); }catch(e){}
}

/* ================================ GPS ================================ */
let watchId=null, lastFix=null, simState=null;
function startGPS(){
  if(watchId!==null) return;
  if(SIM){ simState={lat:47.3769, lon:8.5417, hdg:0, t:now()}; watchId=setInterval(simStep, 1000/Math.min(SIM,10)); return; }
  if(!("geolocation" in navigator)){ gpsState("bad","No GPS on this device"); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onGpsErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}
function stopGPS(){ if(watchId===null) return; if(SIM) clearInterval(watchId); else navigator.geolocation.clearWatch(watchId); watchId=null; }
function simStep(){
  const t=now(), dt=(t-simState.t)/1000; simState.t=t;
  let tgt=330; if(R && R.session){ const s=R.session.segs[R.segIdx]; const z=s&&zones()[s.zone]; if(z) tgt=(z.lo+z.hi)/2 + (s.kind==="work"?8:0); }
  const v=1000/tgt*(0.97+Math.random()*0.06); simState.hdg += (Math.random()-0.5)*0.15;
  const d=v*dt; simState.lat += d*Math.cos(simState.hdg)/111320; simState.lon += d*Math.sin(simState.hdg)/(111320*Math.cos(simState.lat*Math.PI/180));
  if(R && !R.pre && !R.paused && !R.ended){ const n=Math.max(1,Math.round(dt*2.85)); for(let k=n-1;k>=0;k--) stepTs.push(t-k*351); while(stepTs.length && t-stepTs[0]>20000) stepTs.shift(); R.steps=(R.steps||0)+n; R.motion=true; }
  onPos({coords:{latitude:simState.lat+(Math.random()-.5)*2e-5, longitude:simState.lon+(Math.random()-.5)*2e-5, accuracy:5+Math.random()*6, altitude:420+25*Math.sin(t/40000), altitudeAccuracy:4}, timestamp:t});
}
function onGpsErr(e){ gpsState("bad", e.code===1 ? "Location blocked" : "Searching for GPS…"); if(e.code===1) showLocationHelp(); }
function gpsState(cls, text){ const g=$("#gps"); if(g){ g.className="gps "+cls; g.querySelector("span").textContent=text; } }
function onPos(p){
  const acc=p.coords.accuracy;
  lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc, at:now()};
  gpsState(acc<=15?"good":acc<=35?"":"bad", `GPS ±${Math.round(acc)} m`);
  if(!R || R.pre || R.paused || R.ended) return;
  if(acc>40) return;
  const alt=p.coords.altitude, aa=p.coords.altitudeAccuracy;               // elevation gain with a 3 m dead band against GPS noise
  if(alt!=null && !isNaN(alt) && (aa==null || aa<=25)){ if(R.altRef==null) R.altRef=alt; else if(alt>R.altRef+3){ R.up=(R.up||0)+(alt-R.altRef); R.altRef=alt; } else if(alt<R.altRef-3){ R.down=(R.down||0)+(R.altRef-alt); R.altRef=alt; } }
  const pt={t:elapsed(), lat:lastFix.lat, lon:lastFix.lon};
  if(!R.last){ R.last=pt; R.win.push({t:pt.t,d:R.dist}); return; }
  const d=hav(R.last,pt), dt=(pt.t-R.last.t)/1000;
  if(dt<=0) return;
  if(d/dt>9){ R.reject=(R.reject||0)+1; if(R.reject<5) return; }  // implausible jump; accept after repeated agreement
  R.reject=0;
  if(d<Math.max(2,acc*0.3) && dt<15) return;                       // standing-still jitter
  const prevD=R.dist, prevT=R.last.t;
  R.dist+=d; R.last=pt;
  R.win.push({t:pt.t,d:R.dist}); while(R.win.length>2 && pt.t-R.win[1].t>60000) R.win.shift();
  if(!R.pts.length || pt.t-R.pts[R.pts.length-1][2]>=4000) R.pts.push([+pt.lat.toFixed(5), +pt.lon.toFixed(5), Math.round(pt.t)]);
  // kilometre splits
  while(R.dist>=R.nextSplit){
    const tAt = prevT + (R.nextSplit-prevD)/(R.dist-prevD)*(pt.t-prevT);
    const sp = (tAt-R.lastSplitT)/1000; R.splits.push(sp); R.lastSplitT=tAt;
    const seg = R.session ? R.session.segs[R.segIdx] : null;
    if(S.settings.splits && (!seg || (seg.kind!=="work" && seg.kind!=="rec"))){
      say(`Kilometer ${R.splits.length}. Split ${sayPace(sp)}. Total ${sayDur(tAt/1000)}. Average pace ${sayPace(tAt/1000/(R.nextSplit/1000))}.`);
    }
    R.nextSplit+=1000;
  }
}
function curPace(){
  if(!R || R.win.length<2) return null;
  const last=R.win[R.win.length-1]; let first=null;
  for(const w of R.win){ if(last.t-w.t<=30000){ first=w; break; } }
  if(!first || first===last) first=R.win[Math.max(0,R.win.length-3)];
  const dd=last.d-first.d, dt=(last.t-first.t)/1000;
  if(dd<15 || dt<5) return null;
  // stale fix → no pace
  if(elapsed()-last.t>15000) return null;
  return dt/(dd/1000);
}

/* ============================== run engine ============================== */
let R=null, loop=null, wakeLock=null;
const elapsed = () => R ? R.acc + (R.paused||R.ended ? 0 : now()-R.resumedAt) : 0;

async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible"){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){ wakeLock=null; } }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && R && !R.ended) keepAwake(); if(document.visibilityState==="hidden" && R) persistActive(); });

function openPreRun(session){
  R=null; startGPS(); audioOn();
  const segs = session ? session.segs : null;
  const est = segs ? {sec:estSec(segs)} : null;
  $("#run").hidden=false; document.body.style.overflow="hidden";
  $("#run").innerHTML = `<div class="bar"><span class="gps" id="gps"><i></i><span>Searching for GPS…</span></span><span class="row" style="gap:6px">${voiceBtn()}<button class="btn sm ghost" data-a="closePre">Cancel</button></span></div>
    <div class="stack"><div class="eyebrow">${session?niceDate(effDate(session),true):"Free run"}</div><h1>${esc(session?session.title:"Free run")}</h1>
    ${est?`<p class="muted num">About ${Math.round(est.sec/60)} min</p>`:`<p class="muted">Kilometre splits and pace, no targets.</p>`}</div>
    ${segs?`<div class="card" style="overflow:auto">${segsHTML(segs)}</div>`:""}
    <div class="card"><div class="row between"><div><strong>Pre-run mobility</strong><div class="small muted num">${tx("Optional · about {m} min · no equipment",{m:"§"}).replace("§", rminSpan("prerun"))}</div></div><button class="btn sm blue" data-a="prerunmob">Start</button></div>${standToggle()}<p class="small muted" style="margin:6px 0 0">${tx("Loosens ankles, hips and calves before you head out. The GPS keeps searching meanwhile.")}</p></div>
    <p class="small muted">Wait for the dot to turn green before starting. Keep the screen on and the app open; the phone can go in an armband or your hand.</p>
    <div class="ctrl" style="grid-template-columns:1fr"><button class="btn red big" data-a="go">Start</button></div>`;
  R = {pre:true, src:session, session: session ? {id:session.id, date:session.date, title:session.title, type:session.type, segs:session.segs} : null};
}
/* step cadence from the motion sensor (needs permission on iPhone, asked when you tap Start) */
let motionOn=false, stepTs=[], mBase=null, mArmed=true, lastStepT=0;
function startMotion(){
  if(SIM) return; const go=()=>{ if(motionOn) return; motionOn=true; window.addEventListener("devicemotion", onMotion); };
  try{ if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function") DeviceMotionEvent.requestPermission().then(st=>{ if(st==="granted") go(); }).catch(()=>{}); else if(typeof DeviceMotionEvent!=="undefined") go(); }catch(e){}
}
function stopMotion(){ if(motionOn){ window.removeEventListener("devicemotion", onMotion); motionOn=false; } stepTs=[]; mBase=null; }
function onMotion(ev){
  if(!R || R.pre || R.paused || R.ended) return;
  const a=ev.accelerationIncludingGravity; if(!a || a.x==null) return;
  const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z), t=now();
  mBase = mBase==null ? m : mBase*0.95 + m*0.05; const sig=m-mBase; R.motion=true;
  if(mArmed && sig>2.0 && t-lastStepT>250){ lastStepT=t; mArmed=false; R.steps=(R.steps||0)+1; stepTs.push(t); while(stepTs.length && t-stepTs[0]>20000) stepTs.shift(); }
  else if(sig<0) mArmed=true;
}
function cadenceNow(){ const t=now(), r=stepTs.filter(x=>t-x<=15000); if(r.length<6) return null; const span=(r[r.length-1]-r[0])/60000; return span>0?Math.round((r.length-1)/span):null; }
function goRun(){
  audioOn(); beep(660,.08); startMotion();
  const sess = R && R.session;
  R = { id:uid(), session:sess, startWall:now(), acc:0, resumedAt:now(), paused:false, ended:false,
        dist:0, last:null, win:[], pts:[], splits:[], nextSplit:1000, lastSplitT:0,
        segIdx:0, segT0:0, segD0:0, results:[], lastCheck:0, okStreak:0, cues:{}, log:[] };
  if(lastFix && now()-lastFix.at<10000 && lastFix.acc<=40){ R.last={t:0,lat:lastFix.lat,lon:lastFix.lon}; R.win.push({t:0,d:0}); }
  drawRunScreen();
  if(sess){ announceSeg(0, true); } else say("Free run started. I'll call out every kilometer.");
  beep(1046,.3,.05);
  keepAwake();
  clearInterval(loop); loop=setInterval(tick, 250);
  persistActive();
}
function segRemaining(seg, segE, segD){ return seg.sec ? seg.sec*1000-segE : seg.m-segD; }
function zoneTxt(z){ return `${sayPace(z.lo)} to ${sayPace(z.hi)}`; }
function announceSeg(i, first){
  const seg=R.session.segs[i]; if(!seg) return;
  const Z=zones()[seg.zone];
  const len = seg.m ? (seg.m>=1000?`${+(seg.m/1000).toFixed(2)} kilometers`:`${seg.m} meters`) : sayDur(seg.sec);
  if(seg.say){ if(seg.kind==="work"){ beep(880,.12); beep(1318,.3,.18); } else beep(660,.15); say(seg.say, true); return; }
  let t;
  if(seg.kind==="work"){ t = `${seg.label}. ${len}${seg.zone==="stride"?" stride, fast and relaxed":` at ${zoneTxt(Z)} per kilometer`}. Go!`; beep(880,.12); beep(880,.12,.18); beep(1318,.35,.36); }
  else if(seg.kind==="rec") t = `Recovery. Jog ${len}.`;
  else if(seg.kind==="warm") t = `${first?"Let's go. ":""}Warm-up, ${len} easy. ${seg.cue||""}`;
  else if(seg.kind==="cool") t = `Cool-down, ${len}. ${seg.cue||""}`;
  else t = `${first?"Let's go. ":""}${seg.label}. Target ${zoneTxt(Z)} per kilometer.`;
  say(t, seg.kind==="work");
}
function finishSeg(seg, segE, segD, silent){
  if(seg.kind==="work" || seg.kind==="steady"){
    const res={label:seg.label, kind:seg.kind, zone:seg.zone, target:seg.m||null, m:segD, sec:segE/1000, pace: segD>20 ? segE/1000/(segD/1000) : null};
    const z=zones()[seg.zone]; res.inZone = res.pace && z ? (res.pace>=z.lo-5 && res.pace<=z.hi+5) : null;
    R.results.push(res);
    if(!silent && seg.kind==="work" && !seg.quiet){
      const verdict = !res.pace||!z ? "" : res.pace>z.hi+5 ? " A bit slow." : res.pace<z.lo-5 ? " Faster than target, hold back next one." : " Right on target.";
      say(`${seg.rep===seg.reps?"Last rep":"Rep "+seg.rep} done. ${seg.m?sayDur(res.sec):(res.m>=1000?(res.m/1000).toFixed(2)+" kilometers":Math.round(res.m)+" meters")}. Pace ${res.pace?sayPace(res.pace):"unknown"}.${verdict}`, true);
    }

}
function tick(){
  if(!R || R.ended || R.paused){ updateRunScreen(); return; }
  const e=elapsed();
  if(R.session){
    let guard=0;
    while(R.segIdx < R.session.segs.length && guard++<200){
      const seg=R.session.segs[R.segIdx], segE=e-R.segT0, segD=R.dist-R.segD0, rem=segRemaining(seg,segE,segD);
      const key=k=>R.cues[R.segIdx+":"+k];
      const mark=k=>R.cues[R.segIdx+":"+k]=1;
      if(rem>0){
        if(seg.sec){
          if(seg.rw && seg.sec>=480 && segE>=seg.sec*500 && !key("half")){ mark("half"); say("Halfway there. You've got this."); }
          if(seg.rw && seg.sec>=600 && rem<=120000 && rem>110000 && !key("2m")){ mark("2m"); say("Two minutes left."); }
          if(seg.sec>=90 && rem<=30000 && rem>25000 && !key("30")){ mark("30"); say(seg.kind==="rec"?"30 seconds. Get ready.":"30 seconds left."); }
          for(const s of [3,2,1]) if(rem<=s*1000 && !key("b"+s)){ mark("b"+s); beep(660,.1); }
        } else {
          if(seg.kind==="work" && seg.m>=400 && rem<=100 && !key("100")){ mark("100"); say("100 meters."); }
          if(seg.kind==="work" && seg.m>=1000 && segD>=seg.m/2 && !key("half")){ mark("half"); const p=segD>50?segE/1000/(segD/1000):null; say(`Halfway${p?". Pace "+sayPace(p):""}.`); }

  updateRunScreen();
}
function paceCheck(seg, segE){
  if(!S.settings.paceAlerts || seg.alerts===false) return;

  const work = seg.kind==="work";

  const p=curPace(); if(!p) return;
  R.lastCheck=e;
  if(p>z.hi+5){ R.okStreak=0; say(`Pick it up. You're at ${sayPace(p)}. Target ${zoneTxt(z)}.`); }
  else if(p<z.lo-5){ R.okStreak=0; say(`Ease off. You're at ${sayPace(p)}. Target ${zoneTxt(z)}.`); }
  else { if(R.okStreak%3===0) say(`On pace. ${sayPace(p)}.`); R.okStreak++; }
}
function pauseRun(){ if(!R||R.paused) return; R.acc=elapsed(); R.paused=true; R.last=null; R.win=[]; say("Paused."); updateRunScreen(); persistActive(); }
function resumeRun(){ if(!R||!R.paused) return; R.resumedAt=now(); R.paused=false; if(lastFix&&now()-lastFix.at<10000){ R.last={t:elapsed(),lat:lastFix.lat,lon:lastFix.lon}; R.win=[{t:R.last.t,d:R.dist}]; } say("Resumed."); keepAwake(); updateRunScreen(); }
function endRun(){

  const dur=R.acc/1000;
  const run = { id:R.id, date:iso(new Date(R.startWall)), startedAt:R.startWall, planId:R.session?R.session.id:null,
    title:R.session?R.session.title:"Free run", type:R.session?R.session.type:"free",
    m:Math.round(R.dist), sec:Math.round(dur), pace: R.dist>50 ? dur/(R.dist/1000) : null,

function skipSegment(){

function updateRunScreen(){

function bindHold(){
  const b=$("#endBtn"), f=$("#endFill"); let t=null, st=0, raf=0;
  const up=()=>{ cancelAnimationFrame(raf); f.style.transform="scaleX(0)"; t=null; };
  const step=()=>{ const k=Math.min(1,(Date.now()-st)/1200); f.style.transform=`scaleX(${k})`; if(k>=1){ up(); endRun(); return; } raf=requestAnimationFrame(step); };
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); st=Date.now(); t=1; raf=requestAnimationFrame(step); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); endRun(); } });
}

function routeSVG(pts){
  if(!pts || pts.length<2) return "";
  const lat0=pts[0][0]*Math.PI/180; const xy=pts.map(p=>[p[1]*Math.cos(lat0), -p[0]]);
  const xs=xy.map(p=>p[0]), ys=xy.map(p=>p[1]); const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
  const W=560,H=300,pad=16, sc=Math.min((W-2*pad)/((mxx-mnx)||1e-9),(H-2*pad)/((mxy-mny)||1e-9));
  const ox=(W-(mxx-mnx)*sc)/2, oy=(H-(mxy-mny)*sc)/2;
  const P=xy.map(p=>[ox+(p[0]-mnx)*sc, oy+(p[1]-mny)*sc]);
  const d=P.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");
  return `<svg class="route" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route"><path d="${d}" fill="none" stroke="var(--red)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="var(--ok)"/><circle cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="6" fill="var(--ink)"/></svg>`;
}
function summaryBody(run){
  const work = (run.results||[]).filter(r=>r.kind==="work");

  return `${routeSVG(run.pts)}
  <div class="stats"><div><span>Distance</span><b class="num">${fmtKm(run.m)}</b></div><div><span>Time</span><b class="num">${fmtDur(run.sec)}</b></div><div><span>Avg /km</span><b class="num">${fmtPace(run.pace)}</b></div></div>
  ${run.cad||run.up!=null?`<div class="stats stats2"><div><span>${tx("Avg cadence")}</span><b class="num">${run.cad?run.cad+" "+tx("spm"):"–"}</b></div><div><span>${tx("Elevation gain")}</span><b class="num">${run.up!=null?run.up+" m":"–"}</b></div><div><span>${tx("Steps")}</span><b class="num">${run.steps?run.steps.toLocaleString(isDE()?"de-DE":"en-GB"):"–"}</b></div></div>`:""}
  ${work.length?`<div class="card"><h3>Reps</h3><table><tr><th>Rep</th><th class="r">Dist</th><th class="r">Time</th><th class="r">Pace</th><th></th></tr>${work.map((r,i)=>{ const z=Z[r.zone]; const c=!r.pace||!z?"":r.pace>z.hi+5?"slow":r.pace<z.lo-5?"fast":"ok"; return `<tr><td>${i+1}</td><td class="r">${r.m>=1000?(r.m/1000).toFixed(2)+" km":Math.round(r.m)+" m"}</td><td class="r">${fmtDur(r.sec)}</td><td class="r">${fmtPace(r.pace)}</td><td class="r">${c?`<span class="chip ${c}">${c==="ok"?"On":c==="slow"?"Slow":"Fast"}</span>`:""}</td></tr>`; }).join("")}</table></div>`:""}
  ${(run.results||[]).filter(r=>r.kind==="steady").map(r=>{ const z=Z[r.zone]; return `<div class="card"><div class="row between"><h3>${esc(r.label)}</h3>${r.pace&&z?`<span class="chip ${r.pace>z.hi+5?"slow":r.pace<z.lo-5?"fast":"ok"}">${fmtPace(r.pace)} /km</span>`:""}</div><p class="small muted">Target ${z?fmtPace(z.lo)+"–"+fmtPace(z.hi):"–"} /km</p></div>`; }).join("")}
  ${run.splits&&run.splits.length?`<div class="card"><h3>Splits</h3><table><tr><th>Km</th><th class="r">Split</th></tr>${run.splits.map((s,i)=>`<tr><td>${i+1}</td><td class="r">${fmtPace(s)}</td></tr>`).join("")}</table></div>`:""}`;
}
function showSummary(run, fresh){

const TEMPO = {"World's greatest stretch":8, "Inchworms":9, "Open book rotations":5, "Cossack squats":5, "Lateral lunges":4, "Arm swings and shoulder squeezes":2, "Calf raises":2.5, "Bodyweight squats":3, "Glute bridges":3.5};

function routineSteps(k){
  const R0=ROUTINES[k], rounds=R0.rounds||1, out=[];
  for(let r=0;r<rounds;r++){ R0.items.map(timedIt).forEach(it=>(it.side?["left","right"]:[null]).forEach(side=>out.push({n:it.n,s:it.s||0,reps:it.reps||null,aim:it.aim||null,cue:it.cue,side,round:r+1,rounds:rounds>1?rounds:null})));
    if(r<rounds-1) out.push({n:"Rest",s:30,cue:"Shake it out. Next round coming up.",rest:true}); }
  return out;
}

const LOWER_RX=/squat|lunge|deadlift|hip thrust|bridge|leg |leg$|calf|glute|step-up|jump|abduction|good morning|pistol|skater|wall sit|swing|broad|clamshell|kick|hydrant|plié|thigh|horse/i;

function stretchFor(w){
  if(!w) return null;
  if(w.blocks && w.blocks.some(b=>/stretch|cool|wind|mobiliz/i.test(b.name))) return null;
  if(w.finisher==="glutestretch") return "glutestretch";
  const names = w.exercises ? w.exercises.map(e=>e.name) : (w.blocks||[]).filter(b=>b.name!=="Warm-up").flatMap(b=>b.items.map(i=>i.n));
  let lo=0, up=0; names.forEach(n=>{ if(/leg curl|leg press|leg extension/i.test(n)) lo++; else { if(LOWER_RX.test(n)) lo++; if(UPPER_RX.test(n)) up++; } });

  if(up>=Math.max(2,lo*2)) return "stretchupper";
  return "stretchfull";
}

function circuitSteps(w, work, warm){
  const steps=[];
  if(warm && !ownWarm(w)) routineSteps("warmup").forEach(s=>steps.push({...s, block:"Warm-up"}));
  w.blocks.forEach((b,bi)=>{
    if(b.name==="Warm-up" && !warm) return;
    const wk = work || b.work;
    for(let r=0;r<b.rounds;r++){
      const flat=[]; (w.timed||b.name==="Warm-up"?b.items.map(timedIt):b.items).forEach(it=>(it.side?["left","right"]:[null]).forEach(side=>flat.push({n:it.n, cue:it.cue, note:it.note, side, aim:it.aim||null, reps:it.reps||null, s:it.reps?0:(it.s||wk), round:r+1, rounds:b.rounds>1?b.rounds:null, block:b.name})));
      flat.forEach((st,ii)=>{
        st.noReady = !(ii===0 && r===0);
        steps.push(st);

        if(!lastItem && b.rest) steps.push({n:"Rest", s:b.rest, rest:true, cue:`Next: ${flat[ii+1].n}${flat[ii+1].side?", "+flat[ii+1].side+" side":""}`, block:b.name, round:r+1, rounds:b.rounds>1?b.rounds:null});
        if(lastItem && r<b.rounds-1) steps.push({n:"Rest", s:30, rest:true, cue:`Round ${r+2} of ${b.rounds} next: ${flat[0].n}`, block:b.name, round:r+1, rounds:b.rounds});
        if(lastItem && r===b.rounds-1 && bi<w.blocks.length-1) steps.push({n:"Rest", s:b.rest>10?60:15, rest:true, cue:`Next up: ${w.blocks[bi+1].name}`, block:b.name});

let play=null, playT=null, playWake=null;
async function startSteps(o){
  audioOn(); beep(660,.05);
  play={...o, d:o.d||todayISO(), i:0, paused:false, started:Date.now(), howOpen: o.howOpen!=null ? o.howOpen : /stretch|mobility|prerun/.test(o.kind)};
  try{ playWake = await navigator.wakeLock?.request("screen"); }catch(e){}
  enterStep(); clearInterval(playT); playT=setInterval(playTick,1000);
}
function enterStep(){
  hush(); const s=play.steps[play.i];
  if(s.rest){ play.phase="go"; play.left=s.s; } else if(s.reps){ play.phase="reps"; play.left=0; }
  else if(s.noReady){ play.phase="go"; play.left=s.s; } else { play.phase="ready"; play.left=5; }
  speakStep(); drawPlayer();
}
function sideWord(st){ return st.side ? ", "+tx(st.side==="left"?"left side":"right side") : ""; }
function restText(i){ const nx=play.steps.slice(i+1).find(x=>!x.rest); return nx ? `${tx("Next")}: ${tr(nx.n)}${sideWord(nx)}${nx.reps?" ×"+nx.reps:""}` : ""; }
function speakStep(){
  const s=play.steps[play.i], n=tr(s.n), side=sideWord(s);
  if(s.rest) say(`${tx("Rest")}. ${restText(play.i)}.`);
  else if(s.reps) say(`${n}${side}. ${s.reps} ${tx("repetitions")}${s.note?", "+tr(s.note):""}. ${tx("Tap done when you're finished.")}`);
  else if(play.phase==="go"){ say(`${n}${side}. ${s.aim?tx("About {n} reps.",{n:s.aim})+" ":""}${tx("Go!")}`); beep(1046,.25); }
  else say(`${tx("Next")}: ${n}${side}. ${s.s} ${tx("seconds")}.`);
}
function advanceStep(){ play.i++; if(play.i>=play.steps.length){ finishPlayer(true); return; } beep(880,.12); enterStep(); }
function playTick(){
  if(!play || play.paused || play.phase==="reps") return;
  play.left--;
  if(play.left<=3 && play.left>0) beep(660,.08);
  if(play.left<=0){ if(play.phase==="ready"){ play.phase="go"; play.left=play.steps[play.i].s; beep(1046,.25); } else { advanceStep(); return; } }
  else if(play.phase==="go" && !play.steps[play.i].rest && play.left===Math.floor(play.steps[play.i].s/2) && play.steps[play.i].s>=40) say("Halfway.");
  drawPlayer();
}

/* guided breathing: 4 seconds in, 6 seconds out */
let br=null;
function startBreathe(min){
  audioOn(); br={end:Date.now()+min*60000, t0:Date.now(), said:0}; try{ navigator.wakeLock?.request("screen").then(w=>{ if(br) br.wake=w; }).catch(()=>{}); }catch(e){}
  hush(); say(tx("Sit or lie comfortably. Breathe in through your nose for 4 seconds, and out slowly for 6."));
  const el=$("#player"); el.hidden=false;
  el.innerHTML=`<div class="ptop"><span class="eyebrow">${tx("Calm breathing")}</span><span class="row" style="gap:6px">${voiceBtn()}</span></div>
    <div class="breathe"><div class="bcirc" id="bcirc"></div><div class="bword" id="bword">${tx("Breathe in")}</div></div>
    <div class="num muted" id="bleft"></div><p class="cue">${tx("In through the nose for 4, out through the mouth for 6. Let your shoulders drop.")}</p>
    <button class="btn" data-a="bstop">${tx("End")}</button>`;
  clearInterval(br.t); br.t=setInterval(breatheTick,100); breatheTick();
}
function breatheTick(){
  if(!br) return; const now2=Date.now(), left=Math.max(0,Math.round((br.end-now2)/1000)), ph=((now2-br.t0)/1000)%10, inh=ph<4, n=Math.floor((now2-br.t0)/10000);
  const c=$("#bcirc"), w=$("#bword"), l=$("#bleft"); if(!c){ stopBreathe(false); return; }
  const sc = inh ? 0.55+0.45*(ph/4) : 1-0.45*((ph-4)/6); c.style.transform=`scale(${sc.toFixed(3)})`;
  w.textContent = inh ? tx("Breathe in") : tx("Breathe out"); l.textContent=fmtDur(left);
  const key=n*2+(inh?0:1); if(br.said!==key+1 && n<3){ br.said=key+1; say(inh?tx("In"):tx("Out")); }
  if(left<=0) stopBreathe(true);
}
function stopBreathe(done){ if(!br) return; clearInterval(br.t); try{ br.wake && br.wake.release(); }catch(e){} br=null; $("#player").hidden=true; $("#player").innerHTML="";
  if(done){ say(tx("Well done. Notice how you feel now.")); toast(tx("Well done. Notice how you feel now.")); } }

function drawPlayer(){

  const total=play.phase==="ready"?5:(s.s||1), frac=reps?1:play.left/total, C=2*Math.PI*46, nxt=play.steps.slice(play.i+1).find(x=>!x.rest);

async function finishPlayer(done){
  const p=play; clearInterval(playT); play=null; try{ playWake && playWake.release(); }catch(e){} $("#player").hidden=true; $("#player").innerHTML="";
  if(p.kind==="warmup" && live){ live.warm=true; saveLive(); showCoach(); if(done) say("Warm-up done. Let's lift."); return; }
  if(/^prerun/.test(p.kind)){
    if(done || p.i>=Math.floor(p.steps.length/2)){ const log={id:uid(), kind:"recover", routine:p.kind, date:todayISO(), startedAt:p.started, sec:Math.round((Date.now()-p.started)/1000)}; await DB.putRun(log); S.recs.push(log); }
    if(p.after){ openPreRun(p.after.s); say(tx(done?"Mobility done. Start your run when the dot is green.":"Okay, straight to the run. Start when the dot is green.")); } else { render(); if(done) toast(tx("{n} saved.",{n:tr(p.name)})); }
    return;
  }
  if(p.flow==="postrun"){
    if(done || p.i>=Math.floor(p.steps.length/2)){ const log={id:uid(), kind:"recover", routine:p.kind, date:todayISO(), startedAt:p.started, sec:Math.round((Date.now()-p.started)/1000)}; await DB.putRun(log); S.recs.push(log); }
    render();

    else postRunDoneSheet(p.didCore);
    return;
  }
  if(p.kind==="circuit") closeSheet();
  if(!(done || p.i>=Math.floor(p.steps.length/2))) return;
  const sec=Math.round((Date.now()-p.started)/1000);
  if(p.kind==="circuit"){
    const log={id:uid(), kind:"lift", circuit:true, planId:p.planId||null, date:todayISO(), startedAt:p.started, workoutId:p.wid, workoutName:p.name, exercises:[], sec};
    await DB.putRun(log); S.lifts.push(log);

    openSheet(`<div class="wrap">${celebrateHTML(praise(), tx(pick(PRAISE_SUB)))}<div><div class="eyebrow num">${tx("Done")} · ${fmtDur(sec)}</div><h2>${esc(p.name)}</h2></div>

    return;
  } else { const log={id:uid(), kind:"recover", routine:p.kind, date:p.d||todayISO(), startedAt:p.started, sec}; await DB.putRun(log); S.recs.push(log); }
  if(done){ say(praise()+" "+tx("{n} done. Great work.",{n:tr(p.name)})); confetti(); } render(); toast(praise()+" "+tx("{n} saved.",{n:tr(p.name)}));
}

function trainingMinutes(d){
  const on=x=>x.date===d;
  return S.runs.filter(on).reduce((t,r)=>t+r.sec/60,0) + S.lifts.filter(on).reduce((t,l)=>t+(l.sec||1800)/60,0) + S.recs.filter(on).reduce((t,r)=>t+(r.sec||0)/60,0) + S.others.filter(on).reduce((t,o)=>t+(+o.min||0),0);
}
function loadReport(){
  const t=parseISO(todayISO()), day=i=>iso(addDays(t,-i)), mins=[]; for(let i=1;i<=28;i++) mins.push(trainingMinutes(day(i)));
  const wk=mins.slice(0,7).reduce((a,b)=>a+b,0), prev=mins.slice(7,28).reduce((a,b)=>a+b,0)/3;
  let streak=0; for(let i=0;i<28 && mins[i]>0;i++) streak++;
  const long=mins.slice(0,7).filter(m=>m>=120).length, rest=mins.slice(0,7).filter(m=>m===0).length;
  const tired=[0,1,2,3,4].map(i=>checkinOf(day(i))).filter(c=>c && (c.e>=2 || c.s>=2 || c.sl>=2)).length;
  const reasons=[];
  if(streak>=7) reasons.push(tx("You've trained {n} days in a row without a rest day.",{n:streak}));
  if(long>=3) reasons.push(tx("{n} days with 2 hours or more of training this week.",{n:long}));
  if(prev>=60 && wk>prev*1.5) reasons.push(tx("This week's training time is {p}% higher than your recent average. Big jumps are the most common cause of injuries.",{p:Math.round((wk/prev-1)*100)}));
  if(rest===0 && wk>=300 && streak<7) reasons.push(tx("No rest day in the last 7 days."));
  if(tired>=3) reasons.push(tx("You've felt tired, sore or slept badly on {n} of the last 5 days.",{n:tired}));
  return {wk, prev, streak, long, rest, tired, reasons};
}

  S.runs.forEach(r=>out.push({t:"run", id:r.id, date:r.date, at:r.startedAt||0, min:r.sec/60, title:r.title, sub:`${fmtDur(r.sec)} · ${fmtKm(r.m)} km · ${fmtPace(r.pace)} /km${r.rpe?` · ${tx("effort")} ${r.rpe}/10`:""}`, a:"viewrun"}));
  S.lifts.forEach(l=>out.push({t:"str", id:l.id, date:l.date, at:l.startedAt||0, min:(l.sec||0)/60, title:l.workoutName, sub:`${l.circuit?tx("guided"):(l.exercises||[]).reduce((t,e)=>t+e.reps.length,0)+" "+tx("sets")} · ${fmtDur(l.sec||0)}${l.edited?" · "+tx("edited"):""}`, a:"viewlift"}));
  S.recs.forEach(r=>out.push({t:"rec", id:r.id, date:r.date, at:r.startedAt||0, min:(r.sec||0)/60, title:(ROUTINES[r.routine]||{name:tx("Routine")}).name, sub:fmtDur(r.sec||0), a:"viewrec"}));
  S.others.forEach(o=>out.push({t:"oth", id:o.id, date:o.date, at:o.startedAt||0, min:o.min, title:o.name, sub:`${o.min} min · ${o.rpe}/10`, a:"viewother"}));
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.at-a.at);
}
function logListHTML(){

  const chips=[["all",tx("All")],["run",tx("Runs")],["str",tx("Strength")],["rec",tx("Stretching & core")],["oth",tx("Other")]].map(([k,l])=>`<button class="btn sm ${f===k?"blue":""}" data-a="logf" data-v="${k}">${l} <span class="num" style="opacity:.7">${k==="all"?all.length:all.filter(e=>e.t===k).length}</span></button>`).join("");
  let last="", rows="";
  list.slice(0,n).forEach(e=>{ if(e.date!==last){ last=e.date; rows+=`<div class="eyebrow" style="margin-top:12px">${niceDate(e.date,true)}</div>`; }
    rows+=`<button class="sess" style="border-left:4px solid ${LOGCOL[e.t]}" data-a="${e.a}" data-id="${e.id}"><span class="dd num">${Math.max(1,Math.round(e.min||0))}<small>min</small></span><span class="tt">${esc(e.title)}<br><span class="small muted num" style="font-weight:400">${esc(e.sub)}</span></span><span class="muted">›</span></button>`; });
  return `<div class="card"><h3>${tx("All sessions")}</h3><div class="row" style="gap:6px">${chips}</div><div class="stack" style="gap:6px">${rows||`<p class="muted small">${tx("Nothing here yet.")}</p>`}</div>

async function saveLiftEdit(id){
  const l=S.lifts.find(x=>x.id===id); if(!l) return;
  const changed=[];
  l.exercises.forEach((e,i)=>{ const w=Number(($("#ew-"+i)||{}).value); const reps=[...document.querySelectorAll(`#es-${i} input`)].map(x=>x.value).filter(v=>v!==""&&v!=null).map(Number).filter(r=>r>0);
    if(!isNaN(w)) e.weight=w; e.reps=reps; changed.push(e); });
  l.exercises=l.exercises.filter(e=>e.reps.length); l.edited=true;
  // if this is the newest session for an exercise, redo its progression from the corrected numbers
  let updated=0;
  l.exercises.forEach(e=>{ const newer=S.lifts.some(o=>o!==l && o.startedAt>l.startedAt && (o.exercises||[]).some(x=>x.exId===e.exId)); if(newer) return;
    const ex=exDef(l.workoutId,e.exId); if(!ex) return;
    if(l.prev && e.exId in l.prev){ if(l.prev[e.exId]) S.strState[e.exId]=l.prev[e.exId]; else delete S.strState[e.exId]; }
    const j=judge(ex,e); e.verdict=j.verdict; S.strState[e.exId]={weight:j.next, fails:j.fails}; updated++; });
  await DB.putRun(l); await saveStr(); render(); openLiftLog(id,false);
  toast(updated?tx("Saved. Your next targets are updated."):tx("Saved."));
}

function chartWeekly(){
  const m0=monday(parseISO(todayISO())), wk=[];
  for(let i=11;i>=0;i--){ const m=addDays(m0,-7*i), a=iso(m), b=iso(addDays(m,6)), inR=x=>x.date>=a&&x.date<=b;
    wk.push({m, run:S.runs.filter(inR).reduce((t,r)=>t+r.sec/60,0), str:S.lifts.filter(inR).reduce((t,r)=>t+(r.sec||1800)/60,0), rec:S.recs.filter(inR).reduce((t,r)=>t+r.sec/60,0), oth:S.others.filter(inR).reduce((t,r)=>t+r.min,0)}); }
  const tot=w=>w.run+w.str+w.rec+w.oth;
  const W=560,H=190,pl=34,pr=6,pt=12,pb=22, mx=Math.max(60,...wk.map(tot)), step=mx>300?120:mx>150?60:30, top=Math.ceil(mx/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top), bw=(W-pl-pr)/wk.length;
  let g=""; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const cols=[["run","var(--red)"],["str","var(--blue)"],["rec","var(--muted)"],["oth",CATCOL_OTHER]];
  const bars=wk.map((w,i)=>{ const x=pl+i*bw; let acc=0; const r=cols.map(([k,c])=>{ const v=w[k]; if(!v) return ""; const y0=y(acc), y1=y(acc+v); acc+=v; return `<rect x="${x+bw*.15}" y="${y1}" width="${bw*.7}" height="${Math.max(0,y0-y1)}" fill="${c}"/>`; }).join("");
    return r+(i%2===1||i===wk.length-1?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${w.m.getDate()}.${w.m.getMonth()+1}</text>`:""); }).join("");
  return `<div class="card"><h3>${tx("Training minutes per week")}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx("Training minutes per week")}">${g}${bars}</svg>
    <div class="row small">${[[tx("Running"),"var(--red)"],[tx("Strength & mobility"),"var(--blue)"],[tx("Routines"),"var(--muted)"],[tx("Other"),CATCOL_OTHER]].map(([l,c])=>`<span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></i>${l}</span>`).join("")}</div></div>`;
}
function chartEasy(){
  const pts=S.runs.filter(r=>(r.type==="easy"||r.type==="long")&&r.pace&&r.m>2000).sort((a,b)=>a.startedAt-b.startedAt).slice(-30);
  if(pts.length<2) return "";
  const W=560,H=170,pl=40,pr=10,pt=12,pb=20, ps=pts.map(r=>r.pace), lo=Math.floor((Math.min(...ps)-10)/15)*15, hi=Math.ceil((Math.max(...ps)+10)/15)*15;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1), y=v=>pt+(H-pt-pb)*((v-lo)/(hi-lo));
  let g=""; for(let v=lo; v<=hi; v+=15) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${fmtPace(v)}</text>`;
  return `<div class="card"><div class="row between"><h3>Easy & long run pace</h3><span class="small muted">higher = faster</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average pace on easy and long runs over time">${g}<path d="${pts.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(r.pace).toFixed(1)).join("")}" fill="none" stroke="var(--red)" stroke-width="2"/>${pts.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.pace)}" r="3" fill="var(--red)"/>`).join("")}</svg><p class="small muted">At the same easy effort, this line should creep upward over the weeks.</p></div>`;
}

    async saverun(){ const run=S.pending; const on=$("#rpe .on"); run.rpe=on?+on.dataset.rpe:null; run.note=($("#rNote").value||"").trim();
      await DB.putRun(run); S.runs.push(run); S.pending=null; selectDay(run.date);

          S.settings.ref3k=t3; S.settings.programs.forEach(P=>{ if(P.key==="hm"||P.key==="k10") P.ref3k=t3; }); await saveSettings(); buildItems(); render();

async function setLang(l){ S.settings.lang=l; await saveSettings(); buildItems(); closeSheet(); document.documentElement.lang=l; render(); }
function readForm(){ if(!S.form) return; const lv=$("#fLevel"), st=$("#fStart"); if(lv) S.form.ref3k=lv.value?+lv.value:null; if(st&&st.value) S.form.start=st.value; }
function shiftWeek(k){ S.weekOff+=k; const m=addDays(monday(parseISO(todayISO())),S.weekOff*7); S.sel=S.weekOff===0?todayISO():iso(m); render(); }
function selectDay(d){ S.sel=d; S.weekOff=Math.round((monday(parseISO(d))-monday(parseISO(todayISO())))/(7*864e5)); }
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="fStart" && t.value){ readForm(); openPlanForm(S.form.key,S.form.id); }
  if(t.id==="fLevel"){ readForm(); openPlanForm(S.form.key,S.form.id); }
  if(t.id==="sLang"){ setLang(t.value); }
  if(t.id==="sVoice"){ S.settings.voice=t.checked; await saveSettings(); }
  if(t.id==="sAdapt"){ S.settings.adaptive=t.checked; await saveSettings(); }
  if(t.id==="sAlerts"){ S.settings.paceAlerts=t.checked; await saveSettings(); }
  if(t.id==="sSplits"){ S.settings.splits=t.checked; await saveSettings(); }
  if(t.id==="sVoiceSel"){ S.settings.voiceURI=t.value; await saveSettings(); }
  if(t.id==="imp" && t.files[0]){ try{ const data=JSON.parse(await t.files[0].text()); if(data.app!=="plate-pace-run") throw 0;
      for(const r of data.runs||[]) await DB.putRun(r);
      if(data.v>=4){ S.settings={...clone(DEFAULTS),...data.settings}; S.over={moves:{},skips:{},days:{},...data.over}; S.strState=data.strState||{}; await saveSettings(); await saveOver(); await saveStr(); }
      await loadLogs(); buildItems(); render(); toast(`Imported ${(data.runs||[]).length} sessions.`);
    }catch(err){ toast("That file isn't a Pace backup."); } }
});
document.addEventListener("input", e=>{
  const t=e.target; if(!live) return;
  if(t.dataset.set!==undefined && t.dataset.ex!==undefined){ live.ex[+t.dataset.ex].reps[+t.dataset.set]=t.value; saveLive(); }
  if(t.dataset.wex!==undefined){ const i=+t.dataset.wex; live.ex[i].weight=+t.value||0; const pl=$(`#pl-${i}`); if(pl) pl.innerHTML=platesHTML(+t.value||0); saveLive(); }
});
function showLocationHelp(){

function resumeActive(){
  const snap=S.activeSnap; R={...snap}; R.resumedAt=now(); R.paused=true; R.last=null; R.win=[];

/* ================================ boot ================================ */
function route(){ const h=location.hash.slice(1); S.view=["today","plan","strength","log","settings"].includes(h)?h:"today"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);
async function loadLogs(){ const all=await DB.runs()||[]; S.runs=all.filter(x=>!x.kind); S.lifts=all.filter(x=>x.kind==="lift"); S.recs=all.filter(x=>x.kind==="recover"); S.others=all.filter(x=>x.kind==="other"); }
async function migrate(){
  // earlier versions: one half-marathon plan and one gym program
  const old=await DB.get("settings"), gym=await DB.get("gym"), st=clone(DEFAULTS);
  if(old){ ["voice","voiceURI","paceAlerts","splits"].forEach(k=>{ if(old[k]!==undefined) st[k]=old[k]; });
    const days=old.days?[...new Set(Object.values(old.days))].sort():PROGRAMS.hm.days; const [h,m]=String(old.targetHM||"2:00:00").split(":").map(Number);
    const hmSec=(h||2)*3600+(m||0)*60; st.programs.push({id:"p"+uid(), key:old.program==="start"?"start":"hm", days, start:todayISO(), ref3k:Math.round(hmSec*Math.pow(3/21.0975,1.06)), level:1}); }
  if(gym){ const g=gym.workouts?{active:"runner",programs:{runner:gym}}:gym;
    if(old) st.programs.push({id:"p"+uid(), key:g.active||"runner", days:[...PROGRAMS[g.active||"runner"].days], start:todayISO(), level:1});
    const ids=new Set(Object.values(WORKOUTS).flatMap(w=>(w.exercises||[]).map(e=>e.id)));
    Object.values(g.programs||{}).forEach(p=>(p.workouts||[]).forEach(w=>(w.exercises||[]).forEach(ex=>{ const nid={g2:"rdl",l2:"rdl",g3:"bss",l4:"bss",g6:"legcurl",l6:"legcurl"}[ex.id]||ex.id; if(ids.has(nid)) S.strState[nid]={weight:ex.weight, fails:ex.fails||0}; }))); }
  return st;
}
(async function boot(){
  await DB.open();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  S.strState = await DB.get("strState") || {};
  const st = await DB.get("settings2");
  S.settings = st ? {...clone(DEFAULTS), ...st} : await migrate();
  if(!st){ await saveSettings(); await saveStr(); }
  S.over = {moves:{}, skips:{}, days:{}, ...(await DB.get("over2")||{})};
  await loadLogs(); buildItems();
  let brk=false; S.settings.programs.forEach(P=>{ if(coachAfterBreak(P)) brk=true; }); if(brk){ await saveSettings(); buildItems(); }
  route();
  const act = await DB.get("active");
  if(act && now()-act.savedAt < 6*3600e3){
    S.activeSnap=act;
    openSheet(`<div class="wrap"><h1>Unfinished run</h1><p>A run from ${new Date(act.startWall).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} was interrupted at ${fmtKm(act.dist)} km, ${fmtDur(act.acc/1000)}.</p>
      <div class="stack"><button class="btn red block" data-a="resume">Continue it</button><button class="btn block" data-a="saveactive">Finish and save</button><button class="btn ghost block" data-a="dropactive">Discard</button></div></div>`);
  } else { const lv=lsGet("pp.live2"); if(lv && Date.now()-lv.started<6*3600e3 && WORKOUTS[lv.wid]){
    openSheet(`<div class="wrap"><h1>Unfinished workout</h1><p>${esc(WORKOUTS[lv.wid].name)} from ${new Date(lv.started).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} isn't finished yet.</p>
      <div class="stack"><button class="btn blue block" data-a="resumelift">Continue it</button><button class="btn ghost block" data-a="droplift">Discard</button></div></div>`); } }
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
